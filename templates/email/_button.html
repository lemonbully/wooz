{% comment %}Bulletproof squared button. Params: url, label.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:10px 0 6px 0;">
  <tr>
    <td bgcolor="#0a0a0b" style="background:#0a0a0b;">
      <a href="{{ url }}" style="display:inline-block; padding:13px 28px; font-family:'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace; font-size:12px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#f4f4f2; text-decoration:none; border:1px solid #0a0a0b;">{{ label }}</a>
    </td>
  </tr>
</table>
