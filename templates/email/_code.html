{% comment %}A one-time code, shown as a squared datasheet panel. Params: code.{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:6px 0 4px 0;">
  <tr>
    <td style="background:#ececea; border:1px solid #d7d7d3; padding:20px 16px; text-align:center;">
      <div style="font-family:'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace; font-size:30px; font-weight:700; letter-spacing:0.34em; color:#0a0a0b; padding-left:0.34em;">{{ code }}</div>
    </td>
  </tr>
</table>
