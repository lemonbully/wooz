{% comment %}Section marker  a mono accent label with a trailing rule. Params: text.{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
  <tr>
    <td style="vertical-align:middle; white-space:nowrap; font-family:'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace; font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#4b2bf5; padding-right:12px;">{{ text }}</td>
    <td style="vertical-align:middle; width:100%;"><div style="height:1px; background:#d7d7d3; font-size:0; line-height:1px;">&nbsp;</div></td>
  </tr>
</table>
