{% extends "admin/base_site.html" %}
{% block content %}
<h1>{{ title }}</h1>
<p>These licences will change. A reason is required and is kept in each licence's history.</p>
<ul>{% for obj in queryset %}<li>{{ obj }}</li>{% endfor %}</ul>
<form method="post">
  {% csrf_token %}
  {% for obj in queryset %}<input type="hidden" name="{{ action_checkbox_name }}" value="{{ obj.pk }}">{% endfor %}
  <input type="hidden" name="action" value="{{ action_name }}">
  <p><label for="reason">Reason</label><br><input id="reason" type="text" name="reason" maxlength="300" size="80" required></p>
  <p><input type="submit" class="default" value="Confirm"></p>
</form>
{% endblock %}
