{% extends "accounts/_auth_shell.html" %}

{% block title %}Enter your code · OneWooz{% endblock %}
{% block auth_title %}Enter your code{% endblock %}
{% block auth_subtitle %}
  <p class="auth__subtitle">We sent a 6-digit code to {{ email }}.</p>
{% endblock %}

{% block auth_body %}
  <form method="post" action="{% url 'accounts:login_code_verify' %}" class="auth__form">
    {% csrf_token %}
    <input type="hidden" name="email" value="{{ email }}">

    <div class="field">
      <label class="sr-only" for="code">Six-digit code</label>
      <input class="input input--code" type="text" name="code" id="code"
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             autocomplete="one-time-code" required autofocus>
    </div>

    <button type="submit" class="btn btn--primary btn--block mt-6">Sign in</button>
  </form>
{% endblock %}
