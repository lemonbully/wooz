{% comment %}Report control. Context: kind ("question"|"answer"|"reply"), obj, report_reasons, member.{% endcomment %}
{% if not member or member.pk != obj.author_id %}
<details class="ask-report">
  <summary class="ask-textbtn">Report</summary>
  <form method="post" action="{% url 'ask:report' kind obj.pk %}" class="ask-report__form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label class="sr-only" for="rep-{{ obj.pk }}">Reason</label>
    <select id="rep-{{ obj.pk }}" name="reason" class="ask-select">
      {% for value, label in report_reasons %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
    </select>
    <button type="submit" class="pal-btn pal-btn--ghost ask-btn-sm">Send report</button>
  </form>
</details>
{% endif %}
