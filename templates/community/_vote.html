{% comment %}
Upvote control. Context: url (POST target), n (score), on (bool), label.
Works as a plain form; the community script turns it into a fetch toggle.
{% endcomment %}
<form method="post" action="{{ url }}" class="ask-vote{% if on %} is-on{% endif %}" data-vote>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="ask-vote__btn" aria-pressed="{% if on %}true{% else %}false{% endif %}" aria-label="{{ label|default:'Upvote' }}">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5l7 8h-4.5v6h-5v-6H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
  <span class="ask-vote__n" data-vote-count>{{ n }}</span>
</form>
