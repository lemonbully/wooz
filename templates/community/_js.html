<script nonce="{{ csp_nonce }}">
  (function () {
    "use strict";
    // CSRF: the cookie is ow_csrf / __Host-ow_csrf, so read the token the page
    // rendered rather than a cookie name.
    var CSRF = "{{ csrf_token }}";

    // --- Textareas grow with their content --------------------------------
    var grow = function (el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight + 2, 520) + "px";
    };
    document.querySelectorAll("textarea[data-autosize]").forEach(function (el) {
      el.addEventListener("input", function () { grow(el); });
      grow(el);
    });

    // --- Profile photo: show the chosen picture before it is saved ------
    document.querySelectorAll("[data-avatar-input]").forEach(function (input) {
      input.addEventListener("change", function () {
        var file = input.files && input.files[0];
        var box = input.closest(".ask-photo");
        var avatar = box && box.querySelector(".ask-avatar");
        if (!file || !avatar || !window.URL) return;
        var img = document.createElement("img");
        img.alt = "";
        img.src = URL.createObjectURL(file);
        avatar.textContent = "";
        avatar.appendChild(img);
        avatar.classList.add("ask-avatar--img");
      });
    });

    // --- "Edit profile" popup ---------------------------------------------
    // Opens in place; saves without leaving it, so an error shows inside and
    // nothing typed is lost. Closing without saving puts everything back.
    var dlg = document.getElementById("ask-edit-profile");
    if (dlg && dlg.showModal) {
      var editForm = dlg.querySelector("form");
      var editErr = dlg.querySelector("[data-dlg-error]");
      var editBtn = editForm.querySelector("button[type=submit]");
      var editAvatar = dlg.querySelector(".ask-avatar");
      var editFile = dlg.querySelector("[data-avatar-input]");
      var editRemove = dlg.querySelector("[name=remove_avatar]");
      var avatarHtml = editAvatar.innerHTML, avatarClass = editAvatar.className;
      var showErr = function (msg) {
        editErr.textContent = msg || "";
        editErr.hidden = !msg;
      };
      var openDlg = function () {
        if (dlg.open) return;
        dlg.showModal();
        var first = document.getElementById("pf-name");
        if (first) first.focus();
      };
      document.querySelectorAll("[data-dlg-open=ask-edit-profile]").forEach(function (b) {
        b.addEventListener("click", function (e) { e.preventDefault(); openDlg(); });
      });
      dlg.querySelectorAll("[data-dlg-close]").forEach(function (b) {
        b.addEventListener("click", function (e) { e.preventDefault(); dlg.close(); });
      });
      dlg.addEventListener("close", function () {
        editForm.reset();
        editAvatar.innerHTML = avatarHtml;
        editAvatar.className = avatarClass;
        showErr("");
      });
      // Choosing a new photo and removing the photo are either / or.
      if (editRemove) {
        editFile.addEventListener("change", function () { if (editFile.files.length) editRemove.checked = false; });
        editRemove.addEventListener("change", function () {
          if (!editRemove.checked) return;
          editFile.value = "";
          editAvatar.innerHTML = avatarHtml;
          editAvatar.className = avatarClass;
        });
      }
      editForm.addEventListener("submit", function (e) {
        if (!window.fetch || !window.FormData) return;
        e.preventDefault();
        if (editBtn.disabled) return;
        editBtn.disabled = true;
        editBtn.textContent = "Saving";
        showErr("");
        fetch(editForm.action, {
          method: "POST",
          credentials: "same-origin",
          headers: { "X-CSRFToken": CSRF, "X-Requested-With": "fetch", "Accept": "application/json" },
          body: new FormData(editForm),
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var to = d.redirect || d.join;
            if (to) { window.location.assign(to); return; }
            throw new Error(d.error || "");
          })
          .catch(function (err) {
            var known = err && err.name === "Error" && err.message;
            showErr(known ? err.message : "We couldn't save your profile. Check your connection and try again.");
            editBtn.disabled = false;
            editBtn.textContent = "Save";
          });
      });
      // Rendered open (?edit=1): make it a proper popup.
      if (dlg.open) { dlg.removeAttribute("open"); openDlg(); }
    }

    // --- Submit buttons show they're working -----------------------------
    document.querySelectorAll("form").forEach(function (form) {
      if (form.hasAttribute("data-vote")) return;
      form.addEventListener("submit", function (e) {
        var btn = form.querySelector("button[type=submit][data-busy-label]");
        if (!btn) return;
        if (btn.dataset.busy) { e.preventDefault(); return; }
        btn.dataset.busy = "1";
        btn.setAttribute("aria-busy", "true");
        if (btn.firstChild && btn.firstChild.nodeType === 3) btn.firstChild.textContent = btn.dataset.busyLabel + " ";
      });
    });

    // --- Ask box: Enter sends, matching questions appear as you type -----
    var ask = document.getElementById("ask-q");
    if (ask) {
      var form = document.getElementById("ask-form");
      ask.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          if (ask.value.trim().length < 8) return;
          if (form.requestSubmit) form.requestSubmit(); else form.submit();
        }
      });
      var box = form.querySelector("[data-suggest-list]");
      var list = box && box.querySelector("ul");
      var url = ask.dataset.suggest;
      var timer = null, last = "";
      var render = function (items) {
        list.textContent = "";
        items.forEach(function (it) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = it.url;
          var t = document.createElement("span");
          t.className = "ask-suggest__t";
          t.textContent = it.title;
          var m = document.createElement("span");
          m.className = "ask-suggest__m";
          m.textContent = it.answers + (it.answers === 1 ? " answer" : " answers") + (it.accepted ? " · accepted" : "");
          a.appendChild(t); a.appendChild(m); li.appendChild(a); list.appendChild(li);
        });
        box.hidden = items.length === 0;
      };
      if (box && url && window.fetch) {
        ask.addEventListener("input", function () {
          clearTimeout(timer);
          var q = ask.value.trim();
          if (q.length < 4) { box.hidden = true; last = ""; return; }
          timer = setTimeout(function () {
            if (q === last) return;
            last = q;
            fetch(url + "?q=" + encodeURIComponent(q.slice(0, 120)), { headers: { "Accept": "application/json" } })
              .then(function (r) { return r.ok ? r.json() : { results: [] }; })
              .then(function (d) { if (ask.value.trim() === q) render(d.results || []); })
              .catch(function () {});
          }, 260);
        });
      }
    }

    // --- Votes toggle in place --------------------------------------------
    document.querySelectorAll("form[data-vote]").forEach(function (form) {
      form.addEventListener("submit", function (e) {
        if (!window.fetch) return;
        e.preventDefault();
        var btn = form.querySelector("button");
        if (btn.dataset.busy) return;
        btn.dataset.busy = "1";
        fetch(form.action, {
          method: "POST",
          credentials: "same-origin",
          headers: { "X-CSRFToken": CSRF, "X-Requested-With": "fetch", "Accept": "application/json" },
        })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
          .then(function (res) {
            if (res.d.join) { window.location.href = res.d.join; return; }
            if (res.status !== 200) {
              if (window.OWToast && res.d.error) window.OWToast.error(res.d.error);
              return;
            }
            form.classList.toggle("is-on", !!res.d.voted);
            btn.setAttribute("aria-pressed", res.d.voted ? "true" : "false");
            form.querySelector("[data-vote-count]").textContent = res.d.score;
          })
          .catch(function () { form.submit(); })
          .then(function () { delete btn.dataset.busy; });
      });
    });

    // --- Instant answer: poll while the AI writes ------------------------
    var answer = document.getElementById("ask-answer");
    if (answer && answer.dataset.status === "pending" && window.fetch) {
      var started = Date.now();
      var poll = function () {
        fetch(answer.dataset.statusUrl, { headers: { "Accept": "application/json" }, cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (d && d.html && d.status !== "pending") {
              answer.innerHTML = d.html;
              answer.dataset.status = d.status;
              return;
            }
            if (Date.now() - started < 180000) setTimeout(poll, 2500);
          })
          .catch(function () { if (Date.now() - started < 180000) setTimeout(poll, 5000); });
      };
      setTimeout(poll, 1500);
    }

    // --- "Was this enough?" ---------------------------------------------
    var yes = document.querySelector("[data-enough-yes]");
    if (yes) {
      yes.addEventListener("click", function () {
        var wrap = yes.closest("[data-enough]");
        wrap.querySelector("[data-enough-thanks]").hidden = false;
        yes.hidden = true;
      });
    }

    // --- Live board refreshes itself while the tab is visible ------------
    var board = document.getElementById("ask-live-board");
    if (board && window.fetch) {
      var every = Math.max(10, parseInt(board.dataset.refreshSeconds, 10) || 20) * 1000;
      var refresh = function () {
        if (document.hidden) return;
        fetch(board.dataset.refreshUrl, { headers: { "Accept": "application/json" }, cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (d && d.html) board.innerHTML = d.html; })
          .catch(function () {});
      };
      setInterval(refresh, every);
      document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
    }

    // --- Team desk: keyboard and AI draft ---------------------------------
    var desk = document.querySelector("[data-desk]");
    if (desk) {
      var answerBox = desk.querySelector("[data-desk-answer]");
      var filter = desk.querySelector("[data-desk-filter]");
      var typing = function (el) {
        return el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT" || el.tagName === "SELECT" || el.isContentEditable);
      };
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && document.activeElement === answerBox) {
          e.preventDefault();
          var f = answerBox.form;
          if (f.requestSubmit) f.requestSubmit(); else f.submit();
          return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey || typing(document.activeElement)) return;
        var k = e.key.toLowerCase();
        if (k === "j" && desk.dataset.next) { window.location.href = desk.dataset.next; }
        else if (k === "k" && desk.dataset.prev) { window.location.href = desk.dataset.prev; }
        else if (k === "a" && answerBox) { e.preventDefault(); answerBox.focus(); }
        else if (k === "/" && filter) { e.preventDefault(); filter.focus(); filter.select(); }
      });
      var current = desk.querySelector(".ask-desk__item.is-on");
      if (current && current.scrollIntoView) current.scrollIntoView({ block: "nearest" });

      var sbox = desk.querySelector("[data-suggest-box]");
      if (sbox && answerBox && window.fetch) {
        var sbtn = sbox.querySelector("[data-suggest-btn]");
        var snote = sbox.querySelector("[data-suggest-status]");
        var fill = function (text) {
          if (answerBox.value.trim() && !window.confirm("Replace what you've written with the AI draft?")) return;
          answerBox.value = text;
          answerBox.dispatchEvent(new Event("input"));
          answerBox.focus();
          snote.textContent = "Draft added. Read it, fix anything wrong, then post.";
        };
        var ready = sbox.querySelector("[data-suggest-ready]");
        var tries = 0;
        var check = function (method) {
          var opts = { method: method, credentials: "same-origin", headers: { "Accept": "application/json", "X-CSRFToken": CSRF } };
          return fetch(sbox.dataset.url, opts).then(function (r) { return r.json(); }).then(function (d) {
            if (d.status === "ready") { sbtn.disabled = false; fill(d.text); return; }
            if (d.status === "error") { sbtn.disabled = false; snote.textContent = d.error || "Couldn't draft an answer."; return; }
            if (d.status === "pending" && tries++ < 60) { setTimeout(function () { check("GET"); }, 2000); return; }
            sbtn.disabled = false;
            snote.textContent = "Still drafting. Try again in a moment.";
          });
        };
        sbtn.addEventListener("click", function () {
          if (ready) { fill(ready.content.textContent); ready = null; return; }
          sbtn.disabled = true;
          tries = 0;
          snote.textContent = "Drafting with your Ask prompt…";
          check("POST").catch(function () { sbtn.disabled = false; snote.textContent = "Couldn't reach the server."; });
        });
      }
    }
  })();
</script>
