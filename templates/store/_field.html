{% comment %}
Renders one bound form field in the app style. Pass `field` and optional `cls`
(a width class like app-f--full / app-f--half / app-f--third). Checkboxes
render as inline toggles.
{% endcomment %}
{% if field.field.widget.input_type == "checkbox" %}
  <label class="app-check {{ cls }}">
    {{ field }}
    <span class="app-check__label">{{ field.label }}</span>
    {% if field.help_text %}<span class="app-field-hint">{{ field.help_text }}</span>{% endif %}
  </label>
{% else %}
  <label class="pal-field {{ cls }}">
    <span class="pal-field__label">{{ field.label }}{% if field.field.required %} <span class="app-req">*</span>{% endif %}</span>
    {{ field }}
    {% if field.help_text %}<span class="app-field-hint">{{ field.help_text }}</span>{% endif %}
    {% for error in field.errors %}<span class="app-field-err">{{ error }}</span>{% endfor %}
  </label>
{% endif %}
