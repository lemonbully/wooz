{% extends "store/_shell.html" %}
{% block title %}{{ site.name }} · Invite collaborator{% endblock %}
{% block crumb %}Invite collaborator{% endblock %}

{% block main %}
<div class="app-page">
  <div class="app-head"><div>
    <p class="pal-mono pal-mono--accent">Grow</p>
    <h1 class="app-head__title pal-mt-4">Invite collaborator</h1>
  </div></div>
  <div class="app-block">
    <form method="post" class="app-form app-card" style="padding:1.5rem;">
      {% csrf_token %}
      {% include "store/_form.html" %}
      <div class="app-form__foot">
        <a href="{% url 'store:collaborations' site.id %}" class="pal-btn pal-btn--ghost">Cancel</a>
        <button class="pal-btn" type="submit">Send invite</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
