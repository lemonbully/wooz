{% comment %}
Shared styling for the discount editor and the instant-discount page, so both
surfaces read as the same UI. Included inside a page that provides `csp_nonce`.
{% endcomment %}
<style nonce="{{ csp_nonce }}">
  /* Author display rules (flex) would otherwise beat the UA [hidden] rule, so
     toggled flex/grid elements need this to actually hide. */
  .disc [hidden] { display: none !important; }
  .disc-layout { display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: 1.5rem; align-items: start; }
  @media (max-width: 62rem) { .disc-layout { grid-template-columns: 1fr; } .disc-side { position: static !important; } }
  .disc-main { min-width: 0; }
  .disc-side { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: 1.1rem; }
  .disc-card { background: var(--pal-panel); border: 1px solid var(--pal-line); padding: 1.2rem 1.3rem; margin-bottom: 1.1rem; }
  .disc-card__title { font-family: var(--pal-font-display); font-weight: 500; font-size: 1.02rem; letter-spacing: -0.01em; color: var(--pal-ink); }
  .disc-card__lead { margin: 0.25rem 0 0; color: var(--pal-muted); font-size: 0.85rem; }
  .disc-card__body { margin-top: 1rem; }
  .disc-card__head-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .disc-typegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
  @media (max-width: 40rem) { .disc-typegrid { grid-template-columns: 1fr; } }
  .disc-type { display: flex; gap: 0.6rem; align-items: flex-start; border: 1px solid var(--pal-line); padding: 0.75rem 0.85rem; cursor: pointer; transition: border-color 140ms ease, background 140ms ease; }
  .disc-type:hover { border-color: var(--pal-ink-2); }
  .disc-type.is-on { border-color: var(--pal-accent); background: color-mix(in srgb, var(--pal-accent) 6%, transparent); box-shadow: inset 0 0 0 1px var(--pal-accent); }
  .disc-type input { margin-top: 0.15rem; accent-color: var(--pal-accent); }
  .disc-type__name { font-weight: 500; font-size: 0.9rem; color: var(--pal-ink); }
  .disc-type__desc { display: block; margin-top: 0.15rem; font-size: 0.76rem; color: var(--pal-muted); }
  .disc-opt { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.5rem 0; }
  .disc-opt input[type="radio"], .disc-opt input[type="checkbox"] { margin-top: 0.15rem; width: 1rem; height: 1rem; accent-color: var(--pal-accent); flex: none; }
  .disc-opt__label { font-size: 0.9rem; color: var(--pal-ink-2); }
  .disc-sub { margin: 0.35rem 0 0.6rem 1.6rem; }
  .disc-field + .disc-field { margin-top: 0.9rem; }
  .disc-label { display: block; font-size: 0.82rem; color: var(--pal-muted); margin-bottom: 0.4rem; }
  .disc-in { width: 100%; padding: 0.58rem 0.7rem; border: 1px solid var(--pal-line); background: var(--pal-panel); font: inherit; font-size: 0.9rem; color: var(--pal-ink); }
  .disc-in:focus { outline: 2px solid var(--pal-accent); outline-offset: 1px; border-color: var(--pal-accent); }
  .disc-inline { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: flex-end; }
  .disc-inline > .disc-field { flex: 1 1 12rem; margin-top: 0; }
  .disc-affix { display: flex; align-items: stretch; border: 1px solid var(--pal-line); }
  .disc-affix:focus-within { outline: 2px solid var(--pal-accent); outline-offset: 1px; border-color: var(--pal-accent); }
  .disc-affix__tag { display: flex; align-items: center; padding: 0 0.7rem; background: var(--pal-paper-2); color: var(--pal-muted); font-size: 0.85rem; border-right: 1px solid var(--pal-line); }
  .disc-affix__tag--suf { border-right: 0; border-left: 1px solid var(--pal-line); }
  .disc-affix .disc-in { border: 0; }
  .disc-affix .disc-in:focus { outline: 0; }
  .disc-seg { display: inline-flex; border: 1px solid var(--pal-line); overflow: hidden; }
  .disc-seg label { padding: 0.5rem 0.9rem; font-size: 0.85rem; cursor: pointer; color: var(--pal-ink-2); border-right: 1px solid var(--pal-line); user-select: none; }
  .disc-seg label:last-child { border-right: 0; }
  .disc-seg label.is-on { background: var(--pal-ink); color: var(--pal-paper); }
  .disc-seg input { position: absolute; opacity: 0; pointer-events: none; }
  .disc-picker { margin-top: 0.5rem; }
  .disc-picker > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.8rem; border: 1px solid var(--pal-line); font-size: 0.85rem; color: var(--pal-ink); background: var(--pal-panel); }
  .disc-picker > summary::-webkit-details-marker { display: none; }
  .disc-picker[open] > summary { border-color: var(--pal-accent); }
  .disc-picker__panel { border: 1px solid var(--pal-line); border-top: 0; }
  .disc-picker__search { width: 100%; border: 0; border-bottom: 1px solid var(--pal-line); padding: 0.55rem 0.7rem; font: inherit; font-size: 0.85rem; }
  .disc-picker__search:focus { outline: 0; background: var(--pal-paper); }
  .disc-picker__list { max-height: 15rem; overflow: auto; padding: 0.35rem 0; }
  .disc-pick { display: flex; gap: 0.55rem; align-items: center; padding: 0.4rem 0.75rem; font-size: 0.86rem; cursor: pointer; }
  .disc-pick:hover { background: var(--pal-paper-2); }
  .disc-pick input { accent-color: var(--pal-accent); }
  .disc-pick__meta { margin-left: auto; color: var(--pal-faint); font-size: 0.76rem; }
  .disc-pick.is-hidden { display: none; }
  .disc-picker__empty { padding: 0.75rem; color: var(--pal-faint); font-size: 0.82rem; }
  .disc-count { margin-left: 0.4rem; color: var(--pal-muted); font-size: 0.78rem; }
  .disc-hint { display: block; margin-top: 0.4rem; font-size: 0.76rem; color: var(--pal-faint); }
  .disc-summary dl { margin: 0; }
  .disc-summary dt { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pal-faint); margin-top: 0.85rem; }
  .disc-summary dd { margin: 0.2rem 0 0; font-size: 0.88rem; color: var(--pal-ink-2); }
  .disc-summary__name { font-family: var(--pal-font-display); font-weight: 500; font-size: 1.05rem; color: var(--pal-ink); word-break: break-word; }
  .disc-statuspill { font-family: var(--pal-font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.2rem 0.5rem; border: 1px solid var(--pal-line); color: var(--pal-muted); }
  .disc-errors { border: 1px solid #c0392b; background: color-mix(in srgb, #c0392b 7%, transparent); padding: 0.9rem 1.1rem; margin-bottom: 1.25rem; }
  .disc-errors ul { margin: 0.35rem 0 0; padding-left: 1.1rem; }
  .disc-errors li { font-size: 0.86rem; color: var(--pal-ink-2); margin-top: 0.2rem; }
  .disc-comb { display: flex; flex-direction: column; gap: 0.1rem; }
</style>
