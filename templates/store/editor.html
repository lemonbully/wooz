{% extends "store/_shell.html" %}
{% load static %}

{% block title %}Edit content · {{ site.name }} · OneWooz{% endblock %}
{% block crumb %}Edit content{% endblock %}

{% block head %}{{ block.super }}
{% comment %}
The editor's styles load in <head> (render-blocking) rather than as a <style>
block after the markup: from the body, the browser painted the header before
the rules arrived and the page flashed unstyled for a second on every visit.
{% endcomment %}
<link rel="stylesheet" href="{% static 'css/editor.css' %}">
{% endblock %}

{% block main %}
<div class="ed" id="ed" data-upgrade-url="{{ upgrade_url }}">
  {% csrf_token %}

  <header class="ed-top">
    <div class="ed-top__title">
      <p class="pal-mono pal-mono--accent">Storefront</p>
      <h1>Edit content</h1>
    </div>
    <div class="ed-top__right">
      <div class="ed-save" id="ed-save" data-state="idle"><span class="ed-save__dot"></span><span id="ed-save__text">Saved</span></div>
      <a href="{{ storefront_url }}" target="_blank" rel="noopener" class="pal-btn pal-btn--ghost">View storefront →</a>
    </div>
  </header>

  {# ---- Section tabs with left/right steppers (one item per click) ---- #}
  <div class="ed-tabs-wrap">
    <div class="ed-tabs-nav">
      <button type="button" class="ed-tabs-arrow" data-ed-prev aria-label="Previous section" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <nav class="ed-tabs" id="ed-tabs" aria-label="Content sections">{# Invisible stand-in that holds the strip at a real tab's height until the script draws the tabs (removed then). #}<span class="ed-tab" data-ed-tab-placeholder aria-hidden="true"><span class="ed-tab__ico"></span><span>&nbsp;</span></span></nav>
      <button type="button" class="ed-tabs-arrow" data-ed-next aria-label="Next section">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="ed-body">
    <div class="ed-fields" id="ed-fields"></div>
  </div>
</div>

{{ sections|json_script:"ed-sections" }}
{{ content_data|json_script:"ed-content" }}
{{ datasets|json_script:"ed-datasets" }}
{{ demo_media|json_script:"ed-demo" }}


<script nonce="{{ csp_nonce }}">
(function () {
  "use strict";
  var SECTIONS = JSON.parse(document.getElementById("ed-sections").textContent);
  var CONTENT = JSON.parse(document.getElementById("ed-content").textContent) || {};
  var DATASETS = JSON.parse(document.getElementById("ed-datasets").textContent) || {};
  var DEMO = JSON.parse(document.getElementById("ed-demo").textContent) || {};
  // Neutral placeholder shown in any empty media slot until a real file is picked.
  // Empty upload slots show these (the owner's design): image, landscape
  // video, and portrait video (reels and mobile videos).
  var PLACEHOLDER = "{% static 'img/placeholders/upload-image.webp' %}";
  var PLACEHOLDER_VIDEO = "{% static 'img/placeholders/upload-video.webp' %}";
  var PLACEHOLDER_REEL = "{% static 'img/placeholders/upload-reel.webp' %}";
  // The live storefront's base URL (ends in "/"), for "view page" links.
  var STOREFRONT_URL = "{{ storefront_url|escapejs }}";
  var root = document.getElementById("ed");
  var tabsEl = document.getElementById("ed-tabs");
  var fieldsEl = document.getElementById("ed-fields");
  var saveEl = document.getElementById("ed-save");
  var saveText = document.getElementById("ed-save__text");
  var csrf = (root.querySelector("[name=csrfmiddlewaretoken]") || {}).value || "";
  var saveBase = "{% url 'store:editor_save_section' site.id 'SECTION' %}";
  var uploadUrl = "{% url 'store:editor_upload' site.id %}";
  var mapPreviewUrl = "{% url 'store:editor_map_preview' site.id %}";
  var siteId = "{{ site.id }}";
  // Where a locked (not-in-plan) tab's "Upgrade" button leads.
  var UPGRADE_URL = root.getAttribute("data-upgrade-url") || "";
  var UID = 0;
  var activePanelKey = null;

  // ---- Rich text (TinyMCE, free build) --------------------------------
  var TINY_CONFIG = {
    menubar: "edit view insert format tools table",
    plugins: "advlist autolink lists link image charmap preview anchor searchreplace visualblocks visualchars code fullscreen insertdatetime media table emoticons help wordcount",
    toolbar: "undo redo | blocks fontsize | bold italic underline strikethrough | forecolor backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image media table | blockquote hr | removeformat code fullscreen preview",
    // Wrap toolbar buttons onto multiple rows on narrow screens instead of
    // letting them overflow the editor width (the "Blocks"/"Fontsize" buttons
    // used to spill out of the panel on tablets/phones).
    toolbar_mode: "wrap",
    width: "100%",
    height: 360,
    menubar_sticky: true,
    branding: false,
    promotion: false,
    license_key: "gpl",
    content_style: "body{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6}",
    automatic_uploads: true,
    file_picker_types: "image",
    images_upload_handler: function (blobInfo) {
      return new Promise(function (resolve, reject) {
        var fd = new FormData();
        fd.append("file", blobInfo.blob(), blobInfo.filename());
        fetch(uploadUrl, { method: "POST", headers: { "X-CSRFToken": csrf }, body: fd })
          .then(function (r) { return r.json(); })
          .then(function (d) { if (d && d.url) resolve(d.url); else reject("Upload failed"); })
          .catch(function () { reject("Upload failed"); });
      });
    },
    setup: function (editor) {
      editor.on("change input undo redo keyup SetContent", function () {
        editor.save();
        var ta = editor.getElement();
        if (ta) ta.dispatchEvent(new Event("input", { bubbles: true }));
      });
    }
  };
  // TinyMCE (free GPL build, jsDelivr, no API key) is loaded on demand: only
  // the Blogs / Policies / Pages tabs use it, and as a parser-blocking <script>
  // it used to hold the whole editor back until it had downloaded. Pinned to an
  // exact version so browsers and the CDN cache it long-term.
  var TINY_SRC = "https://cdn.jsdelivr.net/npm/tinymce@6.8.6/tinymce.min.js";
  var tinyLoading = null;
  function loadTiny() {
    if (window.tinymce) return Promise.resolve(window.tinymce);
    if (!tinyLoading) {
      tinyLoading = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = TINY_SRC;
        s.referrerPolicy = "origin";
        s.onload = function () { if (window.tinymce) resolve(window.tinymce); else { tinyLoading = null; reject(new Error("tinymce")); } };
        s.onerror = function () { tinyLoading = null; s.remove(); reject(new Error("tinymce")); };
        document.head.appendChild(s);
      });
    }
    return tinyLoading;
  }
  // Still the one the owner is looking at? A load can finish after they moved
  // on, and an editor mounted in a hidden or collapsed box renders at zero
  // height and never recovers (see activate()).
  function richtextVisible(ta) {
    if (!ta.isConnected) return false;
    // No boxes = it, or an ancestor (inactive panel, hidden list card), is display:none.
    if (!ta.getClientRects().length) return false;
    var acc = ta.closest(".ed-acc__item");
    if (acc && !acc.classList.contains("is-open")) return false;
    var card = ta.closest(".bl__card, .pg__card");
    if (card && !card.classList.contains("is-open")) return false;
    return true;
  }
  function initRichtextIn(scope) {
    if (!scope) return;
    var tas = scope.querySelectorAll("textarea.ed-richtext");
    if (!tas.length) return;
    loadTiny().then(function (tinymce) {
      Array.prototype.forEach.call(tas, function (ta) {
        if (ta.dataset.tmceReady || !richtextVisible(ta)) return;
        ta.dataset.tmceReady = "1";
        tinymce.init(Object.assign({ target: ta }, TINY_CONFIG));
      });
    }).catch(function () { /* the plain textarea stays usable */ });
  }
  function destroyRichtextIn(scope) {
    if (!scope || !window.tinymce) return;
    scope.querySelectorAll("textarea.ed-richtext").forEach(function (ta) {
      var ed = ta.id ? window.tinymce.get(ta.id) : null;
      if (ed) ed.remove();
      delete ta.dataset.tmceReady;
    });
  }
  function syncRichtext() { if (window.tinymce) window.tinymce.triggerSave(); }

  var ICONS = {
    brand:'<path d="M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z"/>',
    appearance:'<rect x="3" y="4" width="18" height="16"/><path d="M4 15l4-4 3 3 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.3"/>',
    hero:'<rect x="3" y="4" width="18" height="12"/><path d="M3 20h18"/>',
    home:'<path d="M3 10l9-7 9 7"/><path d="M5 9v11h14V9"/>',
    blogs:'<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h8"/>',
    pages:'<path d="M9 3h7l4 4v14H9z"/><path d="M16 3v4h4"/><path d="M5 7v13a1 1 0 0 0 1 1h10"/>',
    about:'<circle cx="12" cy="8" r="3.2"/><path d="M5 20a7 7 0 0 1 14 0"/>',
    why:'<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>',
    testimonials:'<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
    faq:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
    footer:'<rect x="3" y="4" width="18" height="16"/><path d="M3 15h18"/>',
    contact:'<rect x="3" y="5" width="18" height="14"/><path d="m4 7 8 6 8-6"/>',
    seo:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    policies:'<path d="M8 3h8l4 4v14H4V3z"/><path d="M8 12h8M8 16h8"/>',
    certifications:'<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>',
    scripts:'<path d="m9 8-4 4 4 4"/><path d="m15 8 4 4-4 4"/>',
    newsletter:'<rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/><path d="M16 15h3"/>'
  };

  function el(t,c,a){var e=document.createElement(t); if(c)e.className=c; if(a)Object.keys(a).forEach(function(k){e.setAttribute(k,a[k]);}); return e;}
  function svg(p,w){return '<svg viewBox="0 0 24 24" width="'+(w||16)+'" height="'+(w||16)+'">'+p+'</svg>';}
  function v(x){return x===undefined||x===null?"":x;}

  // A small trash icon laid ON a media preview (top-right corner). Clicking it
  // clears that slot (the stored value is blanked and autosaved) without
  // opening the picker the tile itself opens.
  var TRASH = '<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>';
  // A slot cleared with that icon carries this marker (never a URL) so the
  // server records "removed by the owner" and the live storefront shows nothing
  // there, instead of the demo photo an untouched empty slot gets. Every
  // preview treats it as empty (see realMedia). Matches editor.py REMOVED_MEDIA.
  var REMOVED_MEDIA = "__removed__";
  function realMedia(u) { u = u == null ? "" : String(u); return u === REMOVED_MEDIA ? "" : u; }
  function mediaDelBtn(label, onDelete) {
    var b = el("button", "ed-media-del", { type: "button", title: label, "aria-label": label });
    b.innerHTML = svg(TRASH, 14);
    b.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); onDelete(); });
    // Enter / Space on the icon must not bubble to the tile's own key handler.
    b.addEventListener("keydown", function (e) { e.stopPropagation(); });
    return b;
  }

  function scalarInput(field, value) {
    var t = field.type;
    if (t === "richtext") {
      var rta = el("textarea", "ed-richtext", { "data-field": field.name, id: "tmce-" + (++UID) });
      rta.value = v(value); return rta;
    }
    if (t === "textarea") {
      var ta = el("textarea", "ed-textarea", { "data-field": field.name });
      if (field.placeholder) ta.placeholder = field.placeholder;
      if (field.maxlength) ta.maxLength = field.maxlength;
      ta.value = v(value); return ta;
    }
    if (t === "tags") {
      // A chip / token input: type a value + Enter or comma to add it as a
      // removable pill; the value is stored on a hidden [data-field] as a
      // comma-joined string, so save/gather and the storefront (which splits on
      // ",") treat it like any text field.
      var tbox = el("div", "ed-tags");
      var tchips = el("div", "ed-tags__chips");
      var thidden = el("input", null, { type: "hidden", "data-field": field.name });
      var tinput = el("input", "ed-tags__input", { type: "text", placeholder: field.placeholder || "Type and press Enter…" });
      var tlist = [];
      if (Array.isArray(value)) tlist = value.map(function (s) { return String(s).trim(); }).filter(Boolean);
      else String(v(value)).split(",").forEach(function (s) { s = s.trim(); if (s) tlist.push(s); });
      function tSync() { thidden.value = tlist.join(", "); thidden.dispatchEvent(new Event("input", { bubbles: true })); }
      function tRender() {
        Array.prototype.slice.call(tchips.querySelectorAll(".ed-tags__chip")).forEach(function (c) { c.remove(); });
        tlist.forEach(function (tag, i) {
          var chip = el("span", "ed-tags__chip");
          var lbl = el("span", "ed-tags__chip-t"); lbl.textContent = tag; chip.appendChild(lbl);
          var x = el("button", "ed-tags__x", { type: "button", "aria-label": "Remove " + tag });
          x.innerHTML = svg('<path d="M6 6 18 18M18 6 6 18"/>', 12);
          x.addEventListener("click", function () { tlist.splice(i, 1); tRender(); tSync(); tinput.focus(); });
          chip.appendChild(x);
          tchips.insertBefore(chip, tinput);
        });
      }
      function tAdd(raw) {
        (raw || "").split(",").forEach(function (s) { s = s.trim(); if (s && tlist.indexOf(s) === -1) tlist.push(s); });
        tinput.value = ""; tRender(); tSync();
      }
      tinput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === ",") { e.preventDefault(); if (tinput.value.trim()) tAdd(tinput.value); }
        else if (e.key === "Backspace" && !tinput.value && tlist.length) { tlist.pop(); tRender(); tSync(); }
      });
      // Commit on comma paste; stop the raw keystrokes from triggering a save
      // (only tSync's hidden-input event should).
      tinput.addEventListener("input", function (e) { e.stopPropagation(); if (tinput.value.indexOf(",") !== -1) tAdd(tinput.value); });
      tinput.addEventListener("blur", function () { if (tinput.value.trim()) tAdd(tinput.value); });
      // Clicking anywhere in the box focuses the input.
      tbox.addEventListener("click", function (e) { if (e.target === tbox || e.target === tchips) tinput.focus(); });
      tchips.appendChild(tinput);
      tbox.appendChild(tchips); tbox.appendChild(thidden);
      tRender();
      return tbox;
    }
    if (t === "segtoggle") {
      // A segmented "one active at a time" toggle (like the hero banner's
      // Image/Video switch). A hidden <select data-field> carries the value, so
      // gather and show_if treat it exactly like a normal select; the buttons
      // just drive it. Each option may carry an "icon" (SVG path).
      var segWrap = el("div", "ed-seg");
      // data-no-enhance keeps custom-select.js from turning this into a visible
      // dropdown; it stays a hidden native <select> that only carries the value.
      var segSel = el("select", null, { "data-field": field.name, "data-no-enhance": "" }); segSel.style.display = "none";
      var segOpts = field.options || [];
      segOpts.forEach(function (o) {
        var opt = el("option"); opt.value = o.value; opt.textContent = o.label;
        if (String(v(value)) === String(o.value)) opt.selected = true;
        segSel.appendChild(opt);
      });
      if (!v(value) && segOpts[0]) segSel.value = segOpts[0].value;
      var segBar = el("div", "bn-seg");
      function segSync() {
        Array.prototype.forEach.call(segBar.children, function (b) {
          b.classList.toggle("is-on", b.getAttribute("data-seg") === (segSel.value || (segOpts[0] && segOpts[0].value)));
        });
      }
      segOpts.forEach(function (o) {
        var b = el("button", "bn-seg__btn", { type: "button", "data-seg": o.value });
        b.innerHTML = (o.icon ? svg(o.icon, 14) : "") + "<span>" + o.label + "</span>";
        b.addEventListener("click", function () {
          if (segSel.value === o.value) return;
          segSel.value = o.value;
          segSel.dispatchEvent(new Event("change", { bubbles: true }));
          segSel.dispatchEvent(new Event("input", { bubbles: true }));
          segSync();
        });
        segBar.appendChild(b);
      });
      segSel.addEventListener("change", segSync);
      segWrap.appendChild(segSel); segWrap.appendChild(segBar);
      segSync();
      return segWrap;
    }
    if (t === "select") {
      var sel = el("select", "ed-select", { "data-field": field.name });
      var opts = field.options_from ? (DATASETS[field.options_from] || []) : (field.options || []);
      if (field.options_from) { var blank = el("option"); blank.value = ""; blank.textContent = "Select…"; sel.appendChild(blank); }
      opts.forEach(function (o) {
        var opt = el("option"); opt.value = o.value; opt.textContent = o.label;
        if (String(v(value)) === String(o.value)) opt.selected = true;
        sel.appendChild(opt);
      });
      return sel;
    }
    if (t === "select_cards") {
      // Visual radio-cards: each option shows a small SVG mockup of the layout,
      // its name and a one-line description. A hidden [data-field] input carries
      // the chosen value so the autosave reader treats it like any other field.
      var cardsWrap = el("div", "ed-styles");
      var hidden = el("input", null, { type: "hidden", "data-field": field.name });
      var optsc = field.options || [];
      hidden.value = v(value) || (optsc[0] && optsc[0].value) || "";
      cardsWrap.appendChild(hidden);
      optsc.forEach(function (o) {
        var card = el("button", "ed-style", { type: "button", "data-card-value": o.value, "aria-pressed": String(hidden.value) === String(o.value) ? "true" : "false" });
        if (String(hidden.value) === String(o.value)) card.classList.add("is-selected");
        card.appendChild(el("span", "ed-style__tick", { "aria-hidden": "true" }));
        var prev = el("span", "ed-style__preview"); prev.innerHTML = o.preview || "";
        card.appendChild(prev);
        var meta = el("div", "ed-style__meta");
        var title = el("span", "ed-style__title"); title.textContent = o.label || o.value;
        meta.appendChild(title);
        if (o.desc) { var d = el("span", "ed-style__desc"); d.textContent = o.desc; meta.appendChild(d); }
        card.appendChild(meta);
        card.addEventListener("click", function () {
          hidden.value = o.value;
          Array.prototype.forEach.call(cardsWrap.querySelectorAll(".ed-style"), function (c) {
            var on = c.getAttribute("data-card-value") === o.value;
            c.classList.toggle("is-selected", on);
            c.setAttribute("aria-pressed", on ? "true" : "false");
          });
          hidden.dispatchEvent(new Event("input", { bubbles: true }));
          hidden.dispatchEvent(new Event("change", { bubbles: true }));
          // Save directly too, so persistence never depends on event bubbling.
          if (field._section) queueSave(field._section);
        });
        cardsWrap.appendChild(card);
      });
      return cardsWrap;
    }
    if (t === "checkbox") {
      var lab = el("label", "ed-check");
      var cb = el("input", null, { type: "checkbox", "data-field": field.name }); cb.checked = !!value;
      var txt = el("span", "ed-check__label"); txt.textContent = field.label || "";
      lab.appendChild(cb); lab.appendChild(txt); return lab;
    }
    if (t === "color") {
      var box = el("div", "ed-color");
      var sw = el("span", "ed-color__swatch");
      var picker = el("input", null, { type: "color" });
      var text = el("input", "ed-input", { type: "text", "data-field": field.name, placeholder: field.placeholder || "#000000" });
      text.value = v(value);
      picker.value = /^#[0-9a-fA-F]{6}$/.test(v(value)) ? value : "#4b2bf5";
      // A field with a placeholder (e.g. "Auto") reads blank as "automatic":
      // its swatch shows a neutral pattern instead of a made-up colour.
      function paintSwatch() {
        var blank = !String(text.value || "").trim();
        sw.classList.toggle("is-auto", blank && !!field.placeholder);
        if (blank) sw.style.background = field.placeholder ? "" : "#4b2bf5";
        else if (/^#[0-9a-fA-F]{3,8}$/.test(text.value)) sw.style.background = text.value;
      }
      paintSwatch();
      picker.addEventListener("input", function () { text.value = picker.value; paintSwatch(); text.dispatchEvent(new Event("input", { bubbles: true })); });
      text.addEventListener("input", paintSwatch);
      sw.appendChild(picker); box.appendChild(sw); box.appendChild(text); return box;
    }
    if (t === "image") {
      // Compact picker: the image preview with "Choose from library" directly
      // beneath it. No URL field  the value is carried on a hidden input so the
      // autosave reader still finds it via [data-field]. The preview shape can
      // mirror usage (landscape / portrait) via field.ratio, and its grid span
      // (field.span) lets e.g. the four brand logos share one row.
      //
      // variant "dropzone": a large upload target (icon + "Upload image" + format
      // hints + corner brackets). The tile opens the device file picker; the
      // library stays available via the button below.
      var drop = field.variant === "dropzone";
      var wrap = el("div", "ed-image" + (drop ? " ed-image--drop" : ""));
      if (field.ratio === "landscape") wrap.classList.add("ed-image--landscape");
      else if (field.ratio === "portrait") wrap.classList.add("ed-image--portrait");
      var tile = el("span", "ed-image__tile", { title: "Choose image", role: "button", tabindex: "0" });
      var hidden = el("input", null, { type: "hidden", "data-field": field.name });
      hidden.value = v(value);
      // Show the uploaded image when there is one; otherwise the neutral
      // placeholder (or the dropzone prompt), so every empty slot reads as "pick
      // an image here" (the value stays blank until they choose a real image).
      function render(u){
        u = realMedia(u);
        tile.innerHTML = "";
        if (u) {
          tile.classList.remove("is-empty"); tile.classList.add("has-image");
          var im = el("img"); im.src = u; im.alt = ""; tile.appendChild(im);
          tile.appendChild(mediaDelBtn("Remove image", function () { setImg(REMOVED_MEDIA); }));
          return;
        }
        tile.classList.remove("has-image");
        if (drop) {
          tile.classList.add("is-empty");
        }
        var imp = el("img", "ed-ph"); imp.src = PLACEHOLDER; imp.alt = "Upload image"; tile.appendChild(imp);
      }
      render(hidden.value);
      var file = el("input", null, { type: "file", accept: "image/*" }); file.style.display = "none";
      function setImg(u){ hidden.value = u; render(u); hidden.dispatchEvent(new Event("input", { bubbles: true })); }
      // Direct upload path (the dropzone's primary action; also a fallback when
      // the media modal isn't mounted).
      // Some fields (the Brand tab's logo/favicon) keep their original format
      // rather than being transcoded to WebP  a favicon must stay a real PNG/ICO.
      var noWebp = !!field.no_webp;
      file.addEventListener("change", function(){
        if (!file.files || !file.files[0]) return;
        var fd = new FormData(); fd.append("file", file.files[0]);
        if (noWebp) fd.append("no_webp", "1");
        setStatus("saving");
        fetch(uploadUrl, { method:"POST", headers:{ "X-CSRFToken": csrf }, body: fd })
          .then(function(r){ return r.json(); }).then(function(d){ if (d && d.url) setImg(d.url); else setStatus("error"); })
          .catch(function(){ setStatus("error"); });

    function addSlide() {

  // ---- Per-page SEO editor (SEO tab, "Different for every page") ----------
  // One tab per storefront page, grouped (Main pages, Policies, Content pages,
  // Blog posts, Products, Categories) with a search box. Only the active page's
  // form is in the DOM; every page's values live in `state` and are what the
  // autosave gathers (wrap._seoGather). Blank fields use the page's auto value,
  // which is shown as the placeholder and in the live search preview.

  // list, groups or search) and edits one flat object: the "Same for every

  function buildSeoPagesEditor(wrap, field, value, opts) {

      : (DATASETS.seo_pages || []).filter(function (g) { return g && g.pages && g.pages.length; });
    var pagesByKey = {};

    var fields = (field.subfields || []).filter(function (sf) { return sf.type !== "heading"; });

    function customCount(g) { return g.pages.filter(function (p) { return isCustom(p.key); }).length; }

    // ---- head: title + search

    var ttl = el("div", "sp__ttl");
    ttl.innerHTML = '<span class="sp__title">' + svg('<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>', 14) + '<span>' + esc(field.label || "Page SEO") + '</span></span>' +
      '<span class="sp__sub">' + (single
        ? "Your home page's SEO. Every other page gets its own from its content, with these filling anything missing. Blank fields use the auto value shown in grey."
        : "Pick a page, then edit its SEO. Blank fields use the auto value shown in grey.") + '</span>';
    var search = el("input", "ed-input sp__search", { type: "search", placeholder: "Search pages…", "aria-label": "Search pages" });
    head.appendChild(ttl);
    if (!single) head.appendChild(search);

    var groupBar = el("div", "sp__groups", { role: "tablist" });
    var strip = el("div", "tb__tabs sp__tabs");
    var form = el("div", "sp__form");
    wrap.appendChild(head);
    if (single) {

    } else {

    function visiblePages() {

        });

    function renderTabs() {

    function autoFor(page, name) {

      switch (name) {
        case "og_title": return a.og_title || a.meta_title || "";
        case "og_description": return a.og_description || a.meta_description || "";
        case "twitter_title": return a.twitter_title || a.og_title || a.meta_title || "";
        case "twitter_description": return a.twitter_description || a.og_description || a.meta_description || "";

      var bar = el("div", "sp__bar");

      form.appendChild(pv);

        pv.querySelector(".sp__pvtitle").textContent = (state[page.key] && state[page.key].meta_title) || autoFor(page, "meta_title") || page.label;
        pv.querySelector(".sp__pvdesc").textContent = (state[page.key] && state[page.key].meta_description) || autoFor(page, "meta_description") || "";
      }

      var grid = el("div", "ed-group sp__grid");
      (field.subfields || []).forEach(function (sf) {
        var blk = fieldBlock(sf, vals[sf.name]);
        if (sf.type !== "heading") {
          var ctl = blk.querySelector("[data-field='" + sf.name + "']");
          var auto = autoFor(page, sf.name);

          if (x !== "" && x !== false) o[sf.name] = x;

      grid.addEventListener("change", read);

      Array.prototype.forEach.call(groupBar.querySelectorAll(".sp__group"), function (b, i) {
        var g = groups[i]; if (!g) return;

    wrap._seoGather = function () {
      if (single) return isCustom("home") ? Object.assign({}, state.home) : {};
      var out = {};
      Object.keys(state).forEach(function (k) { if (isCustom(k)) out[k] = state[k]; });

  function buildTabsEditor(wrap, field, value) {

  // ---- Announcement bar editor ---------------------------------------------
  // Brand tab, top. A live preview of the bar, then the statements as the usual
  // .ed-list > .ed-card rows (so autosave/gather are unchanged). The section's
  // announcement_mode toggle decides what shows: Static = one statement (any
  // others are kept, just set aside), Rotating = up to max_items statements
  // looping left to right. Mirrors storefront/announcement.py.
  var ANN_DEFAULT = "FREE SHIPPING ON ORDERS OVER ₹999";
  function annSegments(text, word, url) {
    text = String(text || "").replace(/\s+/g, " ").trim();
    word = String(word || "").replace(/\s+/g, " ").trim();
    url = String(url || "").trim();
    if (!word || !url) return { before: text || word, word: "", after: "", url: "" };
    if (!text) return { before: "", word: word, after: "", url: url };
    var i = text.toLowerCase().indexOf(word.toLowerCase());
    if (i < 0) return { before: text + " ", word: word, after: "", url: url, appended: true };
    return { before: text.slice(0, i), word: text.slice(i, i + word.length), after: text.slice(i + word.length), url: url };
  }
  function annItemNode(s) {
    var span = el("span", "an__item");
    if (s.before) span.appendChild(document.createTextNode(s.before));
    if (s.word) { var a = el("span", "an__link", { title: "Opens " + s.url + " in a new tab" }); a.textContent = s.word; span.appendChild(a); }
    if (s.after) span.appendChild(document.createTextNode(s.after));
    return span;
  }

  function buildAnnouncementEditor(wrap, field, value) {
    // "tb" borrows the tabbed list editor's look (numbered tabs, one statement
    // shown at a time, delete / move tools), like Why choose us > Points.
    wrap.classList.add("an", "tb");

    var pv = el("div", "an__pv");
    var pvhead = el("div", "an__pvhead");

      svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', 14) +
      '<span>Preview</span></span><span class="an__pvmode"></span>';
    var bar = el("div", "an__bar");
    pv.appendChild(pvhead); pv.appendChild(bar);

    var head = el("div", "tb__head an__head");
    var htitle = el("span", "tb__htitle");
    htitle.innerHTML = svg('<path d="M4 9h16M4 15h10"/>', 14) + '<span>' + (field.label || "Statements") + '</span> <span class="tb__count"></span>';
    var tools = el("div", "tb__tools");
    var delBtn = el("button", "tb__tool tb__tool--del", { type: "button", title: "Delete statement" });
    delBtn.innerHTML = svg('<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>', 14);
    var mvL = el("button", "tb__tool", { type: "button", title: "Move left" }); mvL.innerHTML = svg('<path d="m15 6-6 6 6 6"/>', 14);
    var mvR = el("button", "tb__tool", { type: "button", title: "Move right" }); mvR.innerHTML = svg('<path d="m9 6 6 6-6 6"/>', 14);
    tools.appendChild(delBtn); tools.appendChild(mvL); tools.appendChild(mvR);
    head.appendChild(htitle); head.appendChild(tools);
    var note = el("p", "an__note");
    var strip = el("div", "tb__tabs");

    var list = el("div", "ed-list an__list", { "data-list": field.name });
    var items = (Array.isArray(value) ? value : []).slice(0, max);
    if (!items.length) items = [{}];
    items.forEach(function (item, i) { list.appendChild(listRow(field, item, i)); });

    wrap.appendChild(pv); wrap.appendChild(head); wrap.appendChild(note);
    wrap.appendChild(strip); wrap.appendChild(list);

    function cards() { return Array.prototype.slice.call(list.querySelectorAll(":scope > .ed-card")); }
    function val(card, name) { var i = card.querySelector("[data-field='" + name + "']"); return i ? i.value : ""; }
    function isRotating() {
      var p = wrap.closest(".ed-panel");
      var s = p && p.querySelector("[data-field='announcement_mode']");
      return !!s && s.value === "dynamic";
    }

    // A short note under a statement when its link can't work as typed.
    function cardHint(card) {
      var body = card.querySelector(":scope > .ed-card__body");
      if (!body) return;
      var h = body.querySelector(":scope > .an__hint");
      if (!h) { h = el("p", "an__hint"); body.appendChild(h); }
      var word = val(card, "link_word").trim(), url = val(card, "link_url").trim(), text = val(card, "text");
      var msg = "";
      if (word && !url) msg = "Add where the link opens, or the word shows as plain text.";
      else if (url && !word) msg = "Add the word from the statement that should be the link.";
      else if (word && text.trim() && text.toLowerCase().indexOf(word.toLowerCase()) < 0) msg = "“" + word + "” isn’t in this statement, so it is added at the end as the link.";
      h.textContent = msg;
      h.style.display = msg ? "" : "none";
    }

    function renderPreview(rotating) {
      var cs = cards();
      var segs = [];
      cs.forEach(function (card, i) {
        if (!rotating && i > 0) return;
        var s = annSegments(val(card, "text"), val(card, "link_word"), val(card, "link_url"));
        if (s.before || s.word || s.after) segs.push(s);
      });
      bar.innerHTML = "";
      bar.classList.toggle("is-default", !segs.length);
      if (!segs.length) segs = [{ before: ANN_DEFAULT, word: "", after: "" }];
      pvhead.querySelector(".an__pvmode").textContent = rotating ? "Rotating · left to right" : "Static";
      if (!rotating) { bar.appendChild(annItemNode(segs[0])); return; }
      var repeat = Math.max(1, Math.ceil(8 / segs.length));
      var run = [];
      for (var r = 0; r < repeat; r++) run = run.concat(segs);
      var chars = 0;
      run.forEach(function (s) { chars += (s.before || "").length + (s.word || "").length + (s.after || "").length; });
      var vp = el("div", "an__viewport");
      var track = el("div", "an__track");
      track.style.animationDuration = Math.max(12, Math.round((chars * 7.5 + run.length * 56) / 45)) + "s";
      for (var g = 0; g < 2; g++) {
        var grp = el("div", "an__group");
        run.forEach(function (s) { grp.appendChild(annItemNode(s)); });
        track.appendChild(grp);
      }
      vp.appendChild(track); bar.appendChild(vp);
    }

    function tabLabel(card, i) {
      var t = val(card, "text").replace(/\s+/g, " ").trim();
      return t || ((field.item_label || "Statement") + " " + (i + 1));
    }
    // Numbered tabs, one per statement, then "Add statement" (Rotating only,
    // below the limit). Static has a single tab: statement 1.
    function renderTabs(rotating, cs) {
      strip.innerHTML = "";
      cs.forEach(function (card, i) {
        if (!rotating && i > 0) return;
        var t = el("button", "tb__tab" + (i === state.active ? " is-active" : ""), { type: "button" });
        t.innerHTML = '<span class="tb__tabn">' + (i + 1) + '</span><span class="tb__tabl"></span>';
        t.querySelector(".tb__tabl").textContent = tabLabel(card, i);
        t.addEventListener("click", function () { state.active = i; refresh(); });
        strip.appendChild(t);
      });
      if (rotating && cs.length < max) {
        var add = el("button", "tb__add", { type: "button" });
        add.innerHTML = svg('<path d="M12 5v14M5 12h14"/>', 15) + "<span>Add statement</span>";
        add.addEventListener("click", addItem);
        strip.appendChild(add);
      }
    }

    function refresh() {
      var rotating = isRotating();
      var cs = cards();
      // Static shows statement 1 only; the rest stay saved for Rotating.
      if (!rotating) state.active = 0;
      if (state.active >= cs.length) state.active = Math.max(0, cs.length - 1);
      cs.forEach(function (card, i) {
        card.classList.toggle("is-active", i === state.active);
        cardHint(card);
      });
      renderTabs(rotating, cs);
      tools.style.display = rotating ? "" : "none";
      delBtn.disabled = cs.length <= 1;
      mvL.disabled = state.active <= 0;
      mvR.disabled = state.active >= cs.length - 1;
      var cnt = htitle.querySelector(".tb__count");
      if (cnt) cnt.textContent = rotating ? (cs.length + " / " + max) : "1";
      var extra = cs.length - 1;
      note.textContent = rotating
        ? "Up to " + max + " statements loop from left to right with a gap between them. The bar pauses while a shopper hovers it, so links are easy to click."
        : "A static bar shows one statement." + (extra > 0
            ? " Your other " + extra + " statement" + (extra > 1 ? "s are" : " is") + " kept and shown when you switch to Rotating."
            : " Switch to Rotating to loop up to " + max + " statements.") +
          " Leave it blank to show the default message.";
      renderPreview(rotating);
    }

    function addItem() {
      if (cards().length >= max) return;
      var row = listRow(field, {}, cards().length);
      list.appendChild(row); renumber(list, field);
      state.active = cards().length - 1;
      refresh(); queueSave(field._section);
      var inp = row.querySelector("[data-field='text']"); if (inp) inp.focus();
    }
    delBtn.addEventListener("click", function () {
      var cs = cards(); if (cs.length <= 1) return;
      cs[state.active].remove();
      renumber(list, field);
      if (state.active >= cards().length) state.active = cards().length - 1;
      refresh(); queueSave(field._section);
    });
    function move(dir) {
      var cs = cards(); var i = state.active, j = i + dir;
      if (j < 0 || j >= cs.length) return;
      if (dir < 0) list.insertBefore(cs[i], cs[j]); else list.insertBefore(cs[j], cs[i]);
      renumber(list, field); state.active = j; refresh(); queueSave(field._section);
    }
    mvL.addEventListener("click", function () { move(-1); });
    mvR.addEventListener("click", function () { move(1); });
    wrap.addEventListener("input", function (e) { if (e.target.closest && e.target.closest(".ed-card")) refresh(); });
    // The Static / Rotating toggle is a sibling field of this one.
    document.addEventListener("change", function (e) {
      if (e.target && e.target.getAttribute && e.target.getAttribute("data-field") === "announcement_mode" && wrap.closest(".ed-panel") && wrap.closest(".ed-panel").contains(e.target)) refresh();
    });

    refresh();
    // The mode toggle is only reachable once the panel is assembled.
    setTimeout(refresh, 0);
  }

  // ---- Blogs editor: a filterable list of accordion post cards -------------
  // Each blog post is a collapsible card (one open at a time, remembered across
  // reloads, animated open/close). The card body is one aligned 12-column grid
  // (Title|Slug, Category|Author|Date, Cover|Excerpt, then the full-width Body).
  // It reuses the real .ed-list > .ed-card > .ed-card__body path, so
  // autosave/gather, the media library and richtext work unchanged (item field
  // wraps live inside .blogedit; itemFieldWrap knows to look there).
  function buildBlogsEditor(wrap, field, value) {
    wrap.classList.add("bl");
    var openKey = "ow-ed-blogopen:" + siteId;
    var dragCard = null;

    function fieldByName(n) {
      for (var i = 0; i < field.item_fields.length; i++) if (field.item_fields[i].name === n) return field.item_fields[i];
      return null;
    }
    function panelActive() {
      var p = document.getElementById("ed-panel-" + field._section);
      return !!(p && p.classList.contains("is-active"));
    }
    function fmtDate(s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || "").trim());
      if (!m) return String(s || "");
      var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      var mo = parseInt(m[2], 10);
      if (mo < 1 || mo > 12) return String(s || "");
      return months[mo - 1] + " " + m[3] + ", " + m[1];
    }
    function todayStr() {
      var d = new Date(); function p(n) { return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }
    function cards() { return Array.prototype.slice.call(list.querySelectorAll(":scope > .bl__card")); }
    function indexOf(card) { return cards().indexOf(card); }

    // ----- Toolbar -----
    var bar = el("div", "bl__bar");
    var searchBox = el("label", "bl__search");
    searchBox.innerHTML = svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', 15);
    var searchIn = el("input", null, { type: "search", placeholder: "Search posts by title, category or author…" });
    searchBox.appendChild(searchIn);
    var filters = el("div", "bl__filters");
    var catSel = el("select", "bl__filter", { "data-no-enhance": "", "aria-label": "Filter by category" });
    var statusSel = el("select", "bl__filter", { "data-no-enhance": "", "aria-label": "Filter by status" });
    statusSel.innerHTML = '<option value="">All status</option><option value="published">Published</option><option value="draft">Draft</option>';
    var sortSel = el("select", "bl__filter", { "data-no-enhance": "", "aria-label": "Sort" });
    sortSel.innerHTML = '<option value="manual">Last updated</option><option value="date_desc">Newest first</option><option value="date_asc">Oldest first</option><option value="title">Title A–Z</option>';
    filters.appendChild(catSel); filters.appendChild(statusSel); filters.appendChild(sortSel);
    var addTop = el("button", "bl__addbtn", { type: "button" });
    addTop.innerHTML = svg('<path d="M12 5v14M5 12h14"/>', 15) + "<span>Add post</span>";
    bar.appendChild(searchBox); bar.appendChild(filters); bar.appendChild(addTop);
    wrap.appendChild(bar);

    var empty = el("div", "bl__empty"); empty.textContent = "No posts match your filters."; empty.hidden = true;
    wrap.appendChild(empty);

    // ----- List -----
    var list = el("div", "ed-list bl__list", { "data-list": field.name });
    wrap.appendChild(list);

    var addRow = el("button", "bl__addrow", { type: "button" });
    addRow.innerHTML = '<span class="bl__addrow-plus">' + svg('<path d="M12 5v14M5 12h14"/>', 16) + '</span>' +
      '<span class="bl__addrow-main">Add post</span>' +
      '<span class="bl__addrow-sub">Create a new blog post and share your story with your customers.</span>';
    wrap.appendChild(addRow);

    // ----- Card factory -----
    function makeCard(item) {
      item = item || {};
      var card = el("div", "ed-card bl__card");

      var head = el("div", "bl__head");
      var handle = el("span", "bl__handle", { title: "Drag to reorder", "aria-hidden": "true" });
      handle.innerHTML = svg('<circle cx="9" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="15" cy="18" r="1.3"/>', 16);
      var idxEl = el("span", "bl__idx");
      var thumb = el("span", "bl__thumb is-empty"); var thumbImg = el("img"); thumbImg.alt = ""; thumb.appendChild(thumbImg);
      var metaWrap = el("div", "bl__metahead");
      var titleEl = el("div", "bl__htitle");
      var subEl = el("div", "bl__sub");
      metaWrap.appendChild(titleEl); metaWrap.appendChild(subEl);
      var statusEl = el("button", "bl__status", { type: "button", title: "Toggle published / draft" });
      var dateEl = el("div", "bl__date");
      var acts = el("div", "bl__acts");
      var dupBtn = el("button", "bl__ic", { type: "button", title: "Duplicate post", "aria-label": "Duplicate post" });
      dupBtn.innerHTML = svg('<rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>', 15);
      var delBtn = el("button", "bl__ic bl__ic--del", { type: "button", title: "Delete post", "aria-label": "Delete post" });
      delBtn.innerHTML = svg('<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>', 15);
      var chev = el("button", "bl__chev", { type: "button", "aria-label": "Expand or collapse" });
      chev.innerHTML = svg('<path d="m6 9 6 6 6-6"/>', 16);
      acts.appendChild(dupBtn); acts.appendChild(delBtn); acts.appendChild(chev);
      head.appendChild(handle); head.appendChild(idxEl); head.appendChild(thumb); head.appendChild(metaWrap);
      head.appendChild(statusEl); head.appendChild(dateEl); head.appendChild(acts);

      var body = el("div", "ed-card__body bl__body");
      // One aligned 12-column grid. Each field carries its own span (schema),
      // so rows line up: Title | Slug, Category | Author | Date, Cover | Excerpt,
      // then the Body full width  no half-width body, no leftover gaps.
      var edit = el("div", "blogedit");
      function fb(n) { var f = fieldByName(n); var b = fieldBlock(f, item[n]); b.setAttribute("data-item-field", n); return b; }
      var wTitle = fb("title"), wSlug = fb("slug"), wCat = fb("category"), wAuthor = fb("author"),
          wDate = fb("date"), wImage = fb("image"), wExcerpt = fb("excerpt"), wDesc = fb("description"), wStatus = fb("status");
      // Cover image → the design's "preview + Replace image / Choose from library"
      // layout. Reuses the standard image control (its hidden file input for the
      // device upload, its library button), only re-arranged and re-labelled.
      (function () {
        var imgEl = wImage.querySelector(".ed-image");
        if (!imgEl) return;
        imgEl.classList.add("bl__cover");
        var fileInput = imgEl.querySelector("input[type=file]");
        var libBtn = imgEl.querySelector(".ed-image__pick");
        var ctrls = el("div", "bl__coverctrls");
        var repl = el("button", "bl__coverbtn", { type: "button" });
        repl.innerHTML = svg('<path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>', 15) + "<span>Replace image</span>";
        if (fileInput) repl.addEventListener("click", function () { fileInput.click(); });
        ctrls.appendChild(repl);
        if (libBtn) {
          libBtn.classList.add("bl__coverbtn", "bl__coverbtn--lib");
          libBtn.innerHTML = svg('<rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.6"/><path d="m4 18 5-5 3.5 3.5"/>', 15) + "<span>Choose from library</span>";
          ctrls.appendChild(libBtn);
        }
        var hint = el("span", "bl__coverhint"); hint.innerHTML = "Recommended 1200 × 630 · PNG / JPG / WEBP · Max 5MB";
        ctrls.appendChild(hint);
        imgEl.appendChild(ctrls);
      })();
      wStatus.classList.add("bl__statusfield");
      edit.appendChild(wTitle); edit.appendChild(wSlug);
      edit.appendChild(wCat); edit.appendChild(wAuthor); edit.appendChild(wDate);
      edit.appendChild(wImage); edit.appendChild(wExcerpt);
      edit.appendChild(wDesc);
      edit.appendChild(wStatus);
      body.appendChild(edit);

      card.appendChild(head); card.appendChild(body);
      wireConditionals(body, field.item_fields);

      var titleInput = wTitle.querySelector("[data-field=title]");
      var catInput = wCat.querySelector("[data-field=category]");
      var authorInput = wAuthor.querySelector("[data-field=author]");
      var dateInput = wDate.querySelector("[data-field=date]");
      var imgInput = wImage.querySelector("[data-field=image]");
      var statusInput = wStatus.querySelector("[data-field=status]");
      if (statusInput && !statusInput.value) statusInput.value = "published";

      function refreshHead() {
        titleEl.textContent = (titleInput && titleInput.value.trim()) || "Untitled post";
        var cv = (catInput && catInput.value.trim()) || "";
        var av = (authorInput && authorInput.value.trim()) || "";
        subEl.textContent = cv + (cv && av ? "   ·   " : "") + (av ? "By " + av : "");
        var dv = (dateInput && dateInput.value.trim()) || "";
        dateEl.innerHTML = dv ? ('<span class="bl__date-main">' + fmtDate(dv) + '</span><span class="bl__date-sub">Last updated</span>') : "";
        var iv = realMedia(imgInput && imgInput.value.trim());
        if (iv) { thumb.classList.remove("is-empty"); thumbImg.src = iv; } else { thumb.classList.add("is-empty"); thumbImg.removeAttribute("src"); }
        var sv = (statusInput && statusInput.value) || "published";
        statusEl.textContent = sv === "draft" ? "Draft" : "Published";
        statusEl.setAttribute("data-status", sv);
      }
      [titleInput, catInput, authorInput, dateInput].forEach(function (inp) { if (inp) inp.addEventListener("input", refreshHead); });
      if (catInput) catInput.addEventListener("input", refreshCats);
      if (imgInput) imgInput.addEventListener("input", refreshHead);
      if (statusInput) statusInput.addEventListener("change", refreshHead);

      statusEl.addEventListener("click", function (e) {
        e.stopPropagation();
        if (!statusInput) return;
        statusInput.value = (statusInput.value === "draft") ? "published" : "draft";
        refreshHead();
        applyFilters();
        queueSave(field._section);
      });

      function toggle() { openCard(card, !card.classList.contains("is-open")); }
      head.addEventListener("click", function (e) {
        if (e.target.closest(".bl__ic") || e.target.closest(".bl__status") || e.target.closest(".bl__handle")) return;
        toggle();
      });
      chev.addEventListener("click", function (e) { e.stopPropagation(); toggle(); });

      dupBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (window.tinymce) window.tinymce.triggerSave();
        var data = gatherCard(card);
        if (data.title) data.title = data.title + " (copy)";
        data.slug = "";
        var clone = makeCard(data);
        if (card.nextSibling) list.insertBefore(clone, card.nextSibling); else list.appendChild(clone);
        if (panelActive()) initRichtextIn(clone);
        renumberBlogs(); refreshCats(); applyFilters(); queueSave(field._section);
      });
      delBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        destroyRichtextIn(card);
        card.remove(); renumberBlogs(); refreshCats(); applyFilters(); queueSave(field._section);
      });

      // Drag to reorder (from the handle only).
      handle.addEventListener("mousedown", function () { card.setAttribute("draggable", "true"); });
      card.addEventListener("dragstart", function (e) {
        dragCard = card; card.classList.add("is-dragging");
        try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", ""); } catch (_) {}
      });
      card.addEventListener("dragend", function () {
        card.classList.remove("is-dragging"); card.setAttribute("draggable", "false"); dragCard = null;
        renumberBlogs(); queueSave(field._section);
      });

      card._blog = {
        refreshHead: refreshHead,
        search: function () { return (((titleInput && titleInput.value) || "") + " " + ((catInput && catInput.value) || "") + " " + ((authorInput && authorInput.value) || "")).toLowerCase(); },
        cat: function () { return (catInput && catInput.value.trim()) || ""; },
        status: function () { return (statusInput && statusInput.value) || "published"; },
        date: function () { return (dateInput && dateInput.value.trim()) || ""; },
        title: function () { return (titleInput && titleInput.value.trim()) || ""; }
      };
      refreshHead();
      return card;
    }

    function gatherCard(card) {
      var body = card.querySelector(":scope > .ed-card__body");
      var obj = {};
      field.item_fields.forEach(function (f) { var w = itemFieldWrap(body, f.name); obj[f.name] = w ? gatherValue(w, f) : ""; });
      return obj;
    }

    function openCard(card, open) {
      if (open) {
        cards().forEach(function (c) { if (c !== card) c.classList.remove("is-open"); });
        card.classList.add("is-open");
        if (panelActive()) initRichtextIn(card);
        try { localStorage.setItem(openKey, String(indexOf(card))); } catch (e) {}
      } else {
        card.classList.remove("is-open");
        try { localStorage.setItem(openKey, ""); } catch (e) {}
      }
    }

    function renumberBlogs() {
      cards().forEach(function (c, i) { var n = c.querySelector(":scope > .bl__head > .bl__idx"); if (n) n.textContent = "#" + (i + 1); });
    }

    function refreshCats() {
      var cur = catSel.value, done = {};
      var html = ['<option value="">All categories</option>'];
      cards().forEach(function (c) {
        var cv = c._blog.cat();
        if (cv && !done[cv.toLowerCase()]) {
          done[cv.toLowerCase()] = 1;
          var o = document.createElement("option"); o.value = cv; o.textContent = cv;
          html.push(o.outerHTML);
        }
      });
      catSel.innerHTML = html.join("");
      catSel.value = done[cur.toLowerCase()] ? cur : "";
    }

    function applyFilters() {
      var q = (searchIn.value || "").trim().toLowerCase();
      var fc = catSel.value, fs = statusSel.value, sort = sortSel.value;
      var arr = cards();
      if (sort !== "manual") {
        arr = arr.slice().sort(function (a, b) {
          if (sort === "title") return a._blog.title().localeCompare(b._blog.title());
          var da = a._blog.date(), db = b._blog.date();

      empty.hidden = shown !== 0 || cards().length === 0;

    // The add-row lives after the list in `wrap`, not inside it, so sorting
    // inserts before nothing (append). Kept as a helper for clarity.
    function addRowRef() { return null; }

    function addPost() {
      var card = makeCard({ status: "published", date: todayStr() });
      list.appendChild(card);
      renumberBlogs(); refreshCats(); applyFilters();
      openCard(card, true);
      queueSave(field._section);
      try { card.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
    }

    // ----- Wire toolbar -----
    searchIn.addEventListener("input", applyFilters);
    catSel.addEventListener("change", applyFilters);
    statusSel.addEventListener("change", applyFilters);
    sortSel.addEventListener("change", function () { applyFilters(); if (sortSel.value !== "manual") queueSave(field._section); });
    addTop.addEventListener("click", addPost);
    addRow.addEventListener("click", addPost);

    // Drag-over reordering (bound once on the list).
    list.addEventListener("dragover", function (e) {
      if (!dragCard) return;
      e.preventDefault();
      var after = null, min = Infinity;
      cards().forEach(function (c) {
        if (c === dragCard) return;
        var r = c.getBoundingClientRect();
        var offset = e.clientY - (r.top + r.height / 2);
        if (offset < 0 && -offset < min) { min = -offset; after = c; }
      });
      if (after) list.insertBefore(dragCard, after); else list.appendChild(dragCard);
    });
    // Clear any lingering draggable flag after a handle press that didn't drag.
    document.addEventListener("mouseup", function () {
      if (dragCard) return;
      Array.prototype.forEach.call(list.querySelectorAll(":scope > .bl__card[draggable='true']"), function (c) { c.setAttribute("draggable", "false"); });
    });

    // ----- Initial render -----
    (Array.isArray(value) ? value : []).forEach(function (item) { list.appendChild(makeCard(item)); });
    renumberBlogs(); refreshCats(); applyFilters();

    // Restore the last-open card (all closed if none / out of range).
    var storedIdx = -1;
    try { var s = localStorage.getItem(openKey); storedIdx = (s === null || s === "") ? -1 : parseInt(s, 10); } catch (e) {}
    if (storedIdx >= 0) { var all = cards(); if (all[storedIdx]) all[storedIdx].classList.add("is-open"); }
  }

  // ---- Certificates editor (B2B): the Blogs editor's accordion, per certificate
  // Each certificate is a collapsible card (one open at a time, remembered
  // across reloads, drag to reorder) whose body is the same 12-column
  // .blogedit grid: Name full width, then the preview Image beside the File.
  // It reuses the real .ed-list > .ed-card > .ed-card__body path, so
  // autosave/gather and the media library work unchanged.
  function buildCertificatesEditor(wrap, field, value) {
    wrap.classList.add("bl", "ce");
    var openKey = "ow-ed-certopen:" + siteId;
    var dragCard = null;

    function fieldByName(n) {
      for (var i = 0; i < field.item_fields.length; i++) if (field.item_fields[i].name === n) return field.item_fields[i];

    }

    }
    function cards() { return Array.prototype.slice.call(list.querySelectorAll(":scope > .bl__card")); }
    function indexOf(card) { return cards().indexOf(card); }
    function isImg(u) { return /\.(png|jpe?g|webp|gif|svg|avif)$/i.test(String(u || "").split(/[?#]/)[0]); }

    // ----- Toolbar -----
    var bar = el("div", "bl__bar");
    var searchBox = el("label", "bl__search");
    searchBox.innerHTML = svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', 15);
    var searchIn = el("input", null, { type: "search", placeholder: "Search certificates by name…" });
    searchBox.appendChild(searchIn);
    var countEl = el("span", "ce__count");
    var addTop = el("button", "bl__addbtn", { type: "button" });
    addTop.innerHTML = svg('<path d="M12 5v14M5 12h14"/>', 15) + "<span>Add certificate</span>";
    bar.appendChild(searchBox); bar.appendChild(countEl); bar.appendChild(addTop);
    wrap.appendChild(bar);

    var empty = el("div", "bl__empty"); empty.textContent = "No certificates match your search."; empty.hidden = true;
    wrap.appendChild(empty);

    var list = el("div", "ed-list bl__list", { "data-list": field.name });

  // Recursive gather over field wrappers, so a list item can itself hold lists
  // (core page → subpages → child pages) and still serialise correctly.
  function readControl(wrap, field) {
    var e2 = wrap.querySelector("[data-field='" + field.name + "']");
    if (!e2) return field.type === "checkbox" ? false : "";
    return field.type === "checkbox" ? e2.checked : e2.value;
  }
  // Find a list-item field wrap inside a card body. Normally it is a direct
  // child; in the banner editor the field is grouped one level down inside a
  // .bn-acc__body accordion section, so check there too. The :scope > chaining
  // never descends into a nested .ed-list, so nested-list cards are unaffected.

           body.querySelector(":scope > .bn-acc > .bn-acc__item > .bn-acc__body > [data-field-wrap='" + name + "']") ||

           // 12-column .blogedit grid. No nested lists here, so a descendant

    section.fields.forEach(function (f) {

  var timers = {};
  function queueSave(key) { clearTimeout(timers[key]); setStatus("saving"); timers[key] = setTimeout(function () { doSave(key); }, 650); }
  function doSave(key) {
    var section = SECTIONS.filter(function (s) { return s.key === key; })[0]; if (!section) return;
    syncRichtext();
    fetch(saveBase.replace("SECTION", key), { method:"POST", headers:{ "Content-Type":"application/json", "X-CSRFToken": csrf }, body: JSON.stringify({ values: gatherSection(section) }) })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function () {

  }

  // ---- Split layout: numbered content panel + media panel + tip bar --------
  // A bespoke two-column section (e.g. "Categories, best-sellers & video"): the
  // left panel holds the text/select fields, the right panel a single media
  // field, and an optional tip bar sits beneath. Fields render through the same
  // fieldBlock, so autosave/gather (see gatherSection's `split` branch) and the
  // media library keep working. Responsive: the panels stack on narrow screens.

    var split = el("div", "spl", { "data-split-section": section.key });
    (section.panels || [{ id: "content" }]).forEach(function (p) {
      var pane = el("div", "spl-panel", { "data-panel": p.id });
      var head = el("div", "spl-panel__head");
      var lead = el("div", "spl-panel__lead");
      if (p.num) { var num = el("span", "spl-panel__num"); num.textContent = p.num; lead.appendChild(num); }
      var ttl = el("span", "spl-panel__ttl"); ttl.textContent = p.title || ""; lead.appendChild(ttl);
      head.appendChild(lead);
      if (p.note) { var note = el("span", "spl-panel__note"); note.textContent = p.note; head.appendChild(note); }
      var body = el("div", "spl-panel__body");
      var mine = section.fields.filter(function (f) { return (f.panel || "content") === p.id; });
      mine.forEach(function (f) { body.appendChild(fieldBlock(f, CONTENT[f.name])); });
      wireConditionals(body, mine);
      pane.appendChild(head); pane.appendChild(body);
      split.appendChild(pane);
    });
    panel.appendChild(split);
    if (section.tip) {
      var tip = el("div", "spl-tip");
      tip.innerHTML = '<span class="spl-tip__ico" aria-hidden="true">' +
        svg('<circle cx="12" cy="12" r="10"/><path d="M12 11v5M12 8h.01"/>', 16) + '</span>' +
        '<span class="spl-tip__lead">Tip</span>' +
        '<span class="spl-tip__txt"></span>';
      tip.querySelector(".spl-tip__txt").textContent = section.tip;

    }
  }

  // ---- Accordion (one open at a time, remembered across refreshes) ----
  function accKey(sectionKey) { return "ow-ed-acc:" + siteId + ":" + sectionKey; }
  function buildAccordion(section, panel) {
    var acc = el("div", "ed-acc", { "data-acc-section": section.key });
    section.fields.forEach(function (f) {
      var item = el("div", "ed-acc__item", { "data-acc": f.name });
      var hdr = el("button", "ed-acc__hdr", { type: "button" });
      hdr.innerHTML = '<span class="ed-acc__ttl">' + (f.label || f.name) + '</span><span class="ed-acc__chev" aria-hidden="true"></span>';
      var body = el("div", "ed-acc__body");
      body.appendChild(fieldBlock(f, CONTENT[f.name]));
      hdr.addEventListener("click", function () { openAcc(section.key, f.name, true); });
      // A named item (a custom policy) shows its title in the header as typed.

      if (titleIn) {
        var ttlEl = hdr.querySelector(".ed-acc__ttl");
        var syncTtl = function () {
          var t = String(titleIn.value || "").trim();
          ttlEl.textContent = t ? (f.label || f.name).replace(/\s*\(optional\)$/, "") + " · " + t : (f.label || f.name);
        };
        titleIn.addEventListener("input", syncTtl); syncTtl();

      acc.appendChild(item);
    });

  }
  function openAcc(sectionKey, name, toggle) {

    if (!acc) return;

    var openName = "";

  function restoreAcc(sectionKey, fields) {

  // ---- "Auto-saved" toast (slides in from the right on each save) ------
  var toastEl = null, toastTimer = null;
  function showSavedToast() {
    if (!toastEl) {
      toastEl = el("div", "ed-toast", { role: "status", "aria-live": "polite" });
      toastEl.innerHTML = '<span class="ed-toast__ico" aria-hidden="true">' + svg('<path d="M20 6 9 17l-5-5"/>', 16) + '</span><span class="ed-toast__msg">Content auto-saved</span>';
      document.body.appendChild(toastEl);

  var LOCK_PATH = '<rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>';
  // A tab the owner's (free) plan doesn't include: instead of its fields, an
  // upgrade panel. The server also refuses a save to it, so this is UI only.
  function buildLockedPanel(section) {
    var box = el("div", "ed-locked");
    var ico = el("span", "ed-locked__ico", { "aria-hidden": "true" }); ico.innerHTML = svg(LOCK_PATH, 20);
    var t = el("div", "ed-locked__title"); t.textContent = "“" + section.label + "” isn’t in your plan";

  // Tabs are cheap, so all of them are drawn up front. Panels are not: each is

  // edited, so autosave (which only fires from inside a panel) never needs it.
  var tabPlaceholder = tabsEl.querySelector("[data-ed-tab-placeholder]");
  if (tabPlaceholder) tabPlaceholder.remove();
  SECTIONS.forEach(function (section) {
    section.fields.forEach(function (f) { f._section = section.key; });
    var tab = el("button", "ed-tab", { type: "button", "data-tab": section.key });
    tab.innerHTML = '<span class="ed-tab__ico">' + svg(ICONS[section.icon] || ICONS[section.key] || ICONS.brand) + '</span><span>' + section.label + '</span>' +
      (section.locked ? '<span class="ed-tab__lock" aria-hidden="true">' + svg(LOCK_PATH, 12) + '</span>' : '');
    if (section.locked) tab.classList.add("ed-tab--locked");
    tab.addEventListener("click", function () { activate(section.key); });
    tabsEl.appendChild(tab);
  });

  function sectionFor(key) { return SECTIONS.filter(function (s) { return s.key === key; })[0]; }

  function ensurePanel(key) {
    var existing = document.getElementById("ed-panel-" + key);
    if (existing) return existing;
    var section = sectionFor(key);
    if (!section) return null;

    // so each panel starts straight with its fields.

    if (section.locked) {

          var grp = [];

          var lastStyle = styleCtrl.value;
          styleCtrl.addEventListener("input", function () { syncStyleOnly(p); });
          styleCtrl.addEventListener("change", function () {

            // to auto for the new style's background.
            if (styleCtrl.value !== lastStyle) { lastStyle = styleCtrl.value; resetHeroForStyle(p, styleCtrl.value); }
          });

      // editor's own input listener never sees them  refresh it here, and run
      // one render now that the panel (and the style control) is fully built.
      var bannerWrap = panel.querySelector(".ed-field.bn");
      if (bannerWrap && bannerWrap._bnRefresh) {
        var refreshBanner = function () { bannerWrap._bnRefresh(); };
        ["hero_banner_style", "hero_style3_left_bg", "hero_style3_left_bg_text"].forEach(function (fn) {
          var ctrl = panel.querySelector("[data-field='" + fn + "']");
          if (ctrl) { ctrl.addEventListener("input", refreshBanner); ctrl.addEventListener("change", refreshBanner); }
        });
        refreshBanner();
      }
    }
    fieldsEl.appendChild(panel);
    return panel;
  }

  // Show one section: build its panel if needed, mark its tab, mount the
  // rich-text editors it shows. No URL or scroll changes (see activate()).
  function showPanel(key) {
    if (activePanelKey && activePanelKey !== key) {
      var prev = document.getElementById("ed-panel-" + activePanelKey);
      if (prev) destroyRichtextIn(prev);
    }
    var panel = ensurePanel(key);
    activePanelKey = key;
    Array.prototype.forEach.call(tabsEl.children, function (t) { t.setAttribute("aria-current", t.getAttribute("data-tab") === key ? "true" : "false"); });
    Array.prototype.forEach.call(fieldsEl.children, function (p) { p.classList.toggle("is-active", p === panel); });

    var section = sectionFor(key);
    if (section && section.locked) {
      // Upgrade panel only: nothing to mount.
    } else if (section && section.layout === "accordion") {
      restoreAcc(key, section.fields);   // inits the open item's editor
    } else if (panel && (panel.querySelector(".bl") || panel.querySelector(".pg"))) {
      // Blogs / Pages accordion editors: only init the rich-text of an OPEN
      // card. Initialising a TinyMCE editor inside a collapsed (max-height:0)
      // card renders it at zero height and it never recovers on expand  and
      // it's wasteful. openCard() inits a card's editor when it opens; here we
      // cover any card restored open at load.
      Array.prototype.forEach.call(panel.querySelectorAll(".bl__card.is-open, .pg__card.is-open"), function (c) { initRichtextIn(c); });
    } else if (panel) {
      initRichtextIn(panel);
    }
  }

  function activate(key) {
    showPanel(key);
    // Remember the open tab in the URL hash so a refresh reopens it. Uses
    // replaceState (no new history entry, no scroll jump).
    try { history.replaceState(null, "", "#" + key); } catch (e) {}
    var edBody = document.querySelector(".ed-body"); if (edBody) edBody.scrollTop = 0;
    try { window.scrollTo(0, 0); } catch (e) {}

    // The active tab should scroll into the visible part of the strip.
    var active = tabsEl.querySelector("[aria-current='true']");
    if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  }

  fieldsEl.addEventListener("input", function (e) { var p = e.target.closest(".ed-panel"); if (p) queueSave(p.id.replace("ed-panel-", "")); });
  fieldsEl.addEventListener("change", function (e) { if (e.target.type === "checkbox" || e.target.tagName === "SELECT") { var p = e.target.closest(".ed-panel"); if (p) queueSave(p.id.replace("ed-panel-", "")); } });

  // Restore the open tab across a refresh. The tab lives only in the URL hash,
  // so reloading this page (hash intact) reopens it, while navigating here fresh
  // from another page (no hash) opens the default first tab. Only that one
  // panel is built, so the default tab no longer flashes before a restored one.
  (function restoreTab() {
    var key = (location.hash || "").replace(/^#/, "");
    if (key && sectionFor(key)) {
      activate(key);
    } else if (SECTIONS.length) {
      showPanel(SECTIONS[0].key);
    }
  })();

  // Section-tab steppers: each click scrolls the strip by exactly one tab, and
  // an arrow disables itself once its end is reached.
  (function tabSteppers() {
    var prev = document.querySelector("[data-ed-prev]");
    var next = document.querySelector("[data-ed-next]");
    if (!prev || !next) return;
    var EPS = 2;
    function updateArrows() {
      var noScroll = tabsEl.scrollWidth - tabsEl.clientWidth <= EPS;
      prev.disabled = noScroll || tabsEl.scrollLeft <= EPS;
      next.disabled = noScroll || tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - EPS;
    }
    function step(dir) {
      var tabs = Array.prototype.slice.call(tabsEl.querySelectorAll(".ed-tab"));
      var box = tabsEl.getBoundingClientRect();
      var i, r;
      if (dir > 0) {
        for (i = 0; i < tabs.length; i++) {
          r = tabs[i].getBoundingClientRect();
          if (r.right > box.right + EPS) { tabs[i].scrollIntoView({ inline: "end", block: "nearest", behavior: "smooth" }); return; }
        }
      } else {
        for (i = tabs.length - 1; i >= 0; i--) {
          r = tabs[i].getBoundingClientRect();
          if (r.left < box.left - EPS) { tabs[i].scrollIntoView({ inline: "start", block: "nearest", behavior: "smooth" }); return; }
        }
      }
    }
    prev.addEventListener("click", function () { step(-1); });
    next.addEventListener("click", function () { step(1); });
    tabsEl.addEventListener("scroll", updateArrows, { passive: true });
    window.addEventListener("resize", updateArrows);
    updateArrows();
    setTimeout(updateArrows, 300);
    setTimeout(updateArrows, 1200);
  })();

  if (window.OWScrollHint) window.OWScrollHint.initAll();

  // Tabs and the open panel are built: reveal them together (editor.css keeps
  // them hidden until now, so a half-built editor is never painted).
  root.classList.add("is-ready");

  // Warm TinyMCE in the background once the page is idle, so opening Blogs,
  // Policies or Pages mounts the rich-text editor without a visible wait. Only
  // when some open-able section actually has a rich-text field.
  function anyRichtext(fields) {
    return (fields || []).some(function (f) {
      return f && (f.type === "richtext" || anyRichtext(f.item_fields) || anyRichtext(f.fields));
    });
  }
  var hasRichtext = SECTIONS.some(function (s) { return !s.locked && anyRichtext(s.fields); });
  if (hasRichtext) {
    var warm = function () { loadTiny().catch(function () {}); };
    if (window.requestIdleCallback) window.requestIdleCallback(warm, { timeout: 4000 });
    else setTimeout(warm, 1500);
  }
})();
</script>
{% endblock %}
