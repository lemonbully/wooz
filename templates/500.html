<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 · Something went wrong</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --ink:#1a1712;
            --muted:#6b6459;
            --line:#e7e2d8;
            --bg:#faf8f4;
            --accent:#4b2bf5;
        }
        html,body{height:100%;width:100%}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
            background:var(--bg);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            -webkit-font-smoothing:antialiased;
        }
        .card{
            width:100%;
            max-width:460px;
            text-align:center;
        }
        .badge{
            display:inline-flex;
            align-items:center;
            gap:8px;
            font-size:12px;
            font-weight:600;
            letter-spacing:.14em;
            text-transform:uppercase;
            color:var(--muted);
            border:1px solid var(--line);
            border-radius:999px;
            padding:6px 14px;
            background:#fff;
        }
        .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
        .code{
            margin-top:28px;
            font-size:clamp(72px,18vw,132px);
            font-weight:700;
            line-height:1;
            letter-spacing:-.04em;
            color:var(--ink);
        }
        .title{
            margin-top:8px;
            font-size:clamp(19px,4.5vw,24px);
            font-weight:600;
            letter-spacing:-.01em;
        }
        .desc{
            margin-top:12px;
            font-size:15px;
            line-height:1.65;
            color:var(--muted);
        }
        .btn{
            margin-top:32px;
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:13px 26px;
            border-radius:12px;
            background:var(--accent);
            color:#fff;
            text-decoration:none;
            font-size:14px;
            font-weight:600;
            transition:transform .18s ease,opacity .18s ease;
        }
        .btn:hover{opacity:.92;transform:translateY(-1px)}
        .btn svg{width:16px;height:16px}
        @media (max-width:480px){.desc{font-size:14px}}
    </style>
</head>
<body>
    <div class="card">
        <span class="badge"><span class="dot"></span>Error 500</span>
        <div class="code">500</div>
        <h1 class="title">Something went wrong</h1>
        <p class="desc">An unexpected error occurred on our end. We’ve been notified and are looking into it  please try again in a moment.</p>
        <a href="{{ home_url|default:'/' }}" class="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            {{ home_label|default:'Back to home' }}
        </a>
    </div>
</body>
</html>
