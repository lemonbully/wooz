{% if field.is_hidden %}{{ field }}{% else %}<div class="mc-field mc-field--{{ field.widget_type }}{% if wide %} mc-field--wide{% endif %}{% if field.errors %} mc-field--err{% endif %}">
  {% if field.widget_type == "checkbox" %}
    <label class="mc-check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label class="mc-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="mc-help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mc-err">{{ e }}</p>{% endfor %}
</div>
{% endif %}
