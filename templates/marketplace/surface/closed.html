{% extends "marketplace/surface/base.html" %}

{% block content %}
<section class="pal-section pal-blueprint">
  <div class="pal-container mk-center">
    <div class="pal-marker"><span class="pal-marker__num">503</span><span>Closed for now</span></div>
    <h1 class="pal-pagehead__title">OneWooz Apps will be back shortly.</h1>
    <p class="pal-lead mk-intro">{{ message }}</p>
    <p class="mk-sub">Apps you already have keep working on your dashboard and store.</p>
    <div class="pal-btn-row mk-intro"><a class="pal-btn pal-btn--ghost" href="{{ dashboard_url }}">Go to your dashboard</a></div>
  </div>
</section>
{% endblock %}
