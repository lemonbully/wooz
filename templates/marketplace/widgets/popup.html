{% autoescape on %}<div class="ow-pop" data-ow-popup="{{ app }}" data-delay="{{ w.delay_seconds|default:5 }}" data-once="{% if w.show_once %}1{% else %}0{% endif %}" hidden role="dialog" aria-modal="true" aria-label="{{ w.heading }}"><div class="ow-pop__card"><button type="button" class="ow-x" data-ow-close aria-label="Close">&times;</button>{% if w.image %}<img src="{{ w.image }}" alt="" loading="lazy">{% endif %}<div class="ow-pop__body"><h3>{{ w.heading }}</h3>{% if w.text %}<p>{{ w.text }}</p>{% endif %}{% if w.button_url %}<a class="ow-btn" href="{{ w.button_url }}">{{ w.button_label|default:"Shop now" }}</a>{% else %}<button type="button" class="ow-btn" data-ow-close>{{ w.button_label|default:"Close" }}</button>{% endif %}</div></div></div>{% endautoescape %}
