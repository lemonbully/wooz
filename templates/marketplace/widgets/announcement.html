{% autoescape on %}<div class="ow-ann"{% if w.bg_color or w.text_color %} style="{% if w.bg_color %}--ow-bg:{{ w.bg_color }};{% endif %}{% if w.text_color %}--ow-fg:{{ w.text_color }};{% endif %}"{% endif %}><span>{{ w.text }}</span>{% if w.link_url %} <a href="{{ w.link_url }}">{{ w.link_label|default:"Learn more" }}</a>{% endif %}{% if w.dismissible %}<button type="button" class="ow-x" data-ow-dismiss="{{ app }}" aria-label="Close">&times;</button>{% endif %}</div>{% endautoescape %}
