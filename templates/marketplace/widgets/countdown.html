{% autoescape on %}<div class="ow-cd"{% if w.bg_color or w.text_color %} style="{% if w.bg_color %}--ow-bg:{{ w.bg_color }};{% endif %}{% if w.text_color %}--ow-fg:{{ w.text_color }};{% endif %}"{% endif %}>{% if w.heading %}<strong>{{ w.heading }}</strong>{% endif %}{% if w.text %}<span>{{ w.text }}</span>{% endif %}<span class="ow-cd__t" data-ow-countdown="{{ w.ends_at }}" aria-label="Time left"><span data-u="d">00</span>:<span data-u="h">00</span>:<span data-u="m">00</span>:<span data-u="s">00</span></span>{% if w.link_url %}<a href="{{ w.link_url }}">{{ w.link_label|default:"Shop now" }}</a>{% endif %}</div>{% endautoescape %}
