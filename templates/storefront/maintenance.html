{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% firstof website.content.site_name website.name "Store" as site_name %}
  <title>{{ site_name }}  we'll be right back</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style nonce="{{ csp_nonce }}">body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-md text-center">
    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-white shadow">
      <i class="fas fa-tools text-2xl text-gray-500"></i>
    </div>
    <h1 class="text-2xl font-semibold text-gray-900 mb-3">We'll be right back</h1>
    <p class="text-gray-600">
      {{ site_name }} is briefly down for maintenance. Please check back soon.
    </p>
  </div>
</body>
</html>
