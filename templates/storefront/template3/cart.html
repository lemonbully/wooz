<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart | Mellow Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div data-header></div>
<main class="container" style="padding-top:clamp(24px,4vw,48px)">
  <h1 class="h1 title-count" style="margin-bottom:28px">Your cart <sup data-cart-count></sup></h1>
  <div data-cart-page></div>

  <section class="section">
    <div class="services" data-services></div>
  </section>

  <section style="padding-bottom:0">
    <div class="sec-head"><h2 class="h2">You may also like</h2><a class="btn btn--outline btn--sm" href="shop.html">Continue shopping</a></div>
    <div class="grid grid--4" data-upsell></div>
  </section>
</main>
<div data-footer></div>

<script src="assets/js/data.js"></script>
<script>
window.T3Page = function () {
  const D = T3, I = T3.I, $ = T3.$;
  const root = $('[data-cart-page]');
  let coupon = null;
  const COUPONS = { MELLOW10: .10, FIRST15: .15 };
  function render() {
    const cart = T3.getCart(), total = T3.cartTotal(), mrp = T3.cartMrp(), left = Math.max(0, D.freeShip - total);
    if (!cart.length) {
      root.innerHTML = `<div class="card empty-state" style="padding:60px 20px">${I.bag.replace(/20/g, '56')}<h2 class="h3">Your cart is empty</h2><p class="muted" style="margin:8px 0 22px">Find something soft to start with.</p><a class="btn btn--black btn--arrow" href="shop.html">Continue Shopping <span class="btn__dot">${I.arrow}</span></a></div>`;
      return;
    }
    const off = coupon ? Math.round(total * COUPONS[coupon]) : 0;
    root.innerHTML = `<div class="cart-layout">
      <div>
        <div class="cart-row small muted hide-sm" style="padding:0 0 12px;font-weight:700;border:0"><span>Product</span><span></span><span>Quantity</span><span>Total</span><span></span></div>
        <div class="cart-table">${cart.map((l, i) => { const p = T3.byId(l.id); return `<div class="cart-row">
          <a class="cart-row__img" href="product.html?p=${p.id}"><img src="${p.img[0]}" alt=""></a>
          <div class="cart-row__info"><a href="product.html?p=${p.id}" style="font-weight:700">${p.name}</a><div class="small muted">${p.catName} · ${l.size}</div>${T3.priceHTML(p)}</div>
          <div class="cart-row__qty"><div class="qty"><button data-qty="${i}" data-d="-1" aria-label="Decrease">${I.minus}</button><input value="${l.qty}" readonly aria-label="Quantity"><button data-qty="${i}" data-d="1" aria-label="Increase">${I.plus}</button></div><button class="line-item__remove" data-remove="${i}" style="display:none">Remove</button></div>
          <div class="cart-row__total">${T3.inr(p.price * l.qty)}</div>
          <button class="line-item__remove cart-row__rm" data-remove="${i}">Remove</button>
        </div>`; }).join('')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px;flex-wrap:wrap">
          <a href="shop.html" class="link small">${'← '}Continue shopping</a>
          <span class="tag">${I.leaf.replace(/26/g, '16')} This order saves 1,840 L of water vs. conventional cotton</span>
        </div>
      </div>
      <aside class="summary">
        <div class="ship-progress">${left ? `Spend <b>${T3.inr(left)}</b> more to reach free shipping!` : 'Free shipping unlocked!'}<div class="ship-progress__bar"><i style="width:${Math.min(100, total / D.freeShip * 100)}%"></i></div></div>
        ${T3.acc('Discount code', `<form class="coupon-row" style="margin:4px 0 0" data-coupon><input class="input" placeholder="Enter code" style="background:#fff" value="${coupon || ''}"><button class="btn btn--black">Apply</button></form><div class="coupon-list" style="margin:12px 0 0"><button type="button" data-code="MELLOW10">MELLOW10 · 10% off</button><button type="button" data-code="FIRST15">FIRST15 · 15% off</button></div>`, !!coupon).replace('class="acc', 'class="acc acc--pill')}
        ${T3.acc('Order notes', `<textarea class="textarea" style="background:#fff;min-height:90px" placeholder="Gift message or delivery instructions"></textarea>`).replace('class="acc', 'class="acc acc--pill')}
        ${T3.acc('Shipping estimate', `<form class="pincode" style="margin:0" data-est><input class="input" style="background:#fff" placeholder="Pincode" maxlength="6"><button class="btn btn--black">Estimate</button></form><p class="small" style="margin-top:8px" data-est-msg></p>`).replace('class="acc', 'class="acc acc--pill')}
        <div class="sum-rows" style="margin-top:14px">
          <div><span class="muted">Subtotal (MRP)</span><span>${T3.inr(mrp)}</span></div>
          ${mrp > total ? `<div style="color:var(--ok)"><span>Product discount</span><span>- ${T3.inr(mrp - total)}</span></div>` : ''}
          ${off ? `<div style="color:var(--ok)"><span>Coupon ${coupon}</span><span>- ${T3.inr(off)}</span></div>` : ''}
          <div><span class="muted">Shipping</span><span>${left ? T3.inr(99) : 'Free'}</span></div>
        </div>
        <div class="summary__total"><b>Estimated total</b><span class="amt">${T3.inr(total - off + (left ? 99 : 0))}</span></div>
        <p class="summary__note" style="margin-bottom:16px">Taxes included. Shipping calculated at checkout.</p>
        <a class="btn btn--black btn--block" href="checkout.html">Check Out</a>
        <div class="pay-icons" style="justify-content:center;margin-top:14px"><span style="background:var(--surface)">UPI</span><span style="background:var(--surface)">VISA</span><span style="background:var(--surface)">MC</span><span style="background:var(--surface)">RUPAY</span><span style="background:var(--surface)">COD</span></div>
      </aside>
    </div>`;
    T3.initAcc(root);
  }
  render();
  document.addEventListener('t3:cart', render);
  root.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.matches('[data-coupon]')) { const v = e.target.querySelector('input').value.trim().toUpperCase(); if (COUPONS[v]) { coupon = v; T3.toast(`${v} applied`); render(); } else T3.toast('That code is not valid'); }
    if (e.target.matches('[data-est]')) { const v = e.target.querySelector('input').value; $('[data-est-msg]').textContent = /^\d{6}$/.test(v) ? `Delivers to ${v} in 2 to 4 days. COD available.` : 'Enter a valid 6 digit pincode.'; }
  });
  root.addEventListener('click', e => { const b = e.target.closest('[data-code]'); if (b) { coupon = b.dataset.code; T3.toast(`${coupon} applied`); render(); } });
  $('[data-services]').innerHTML = [['truck', 'Free delivery', 'On orders above ₹2,999'], ['return', 'Free returns', 'Up to 15 days to return your items'], ['card', 'Payment 100% secured', 'UPI, cards, netbanking and COD'], ['chat', 'Customer service', 'Mon to Sat, 9 AM to 8 PM']].map(([i, t, s]) => `<div class="service">${I[i]}<b>${t}</b><span>${s}</span></div>`).join('');
  $('[data-upsell]').innerHTML = D.products.slice(12, 16).map(p => T3.card(p)).join('');
};
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
