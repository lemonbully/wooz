{% extends "storefront/referral/_page_shell.html" %}
{% block page_inner %}
<div class="px-6 pt-5 pb-8 space-y-5">
	{% for post in blogs %}
	<a href="{{ post.url }}" class="block group">
		<div class="overflow-hidden rounded-xl bg-gray-200 aspect-4-3" style="aspect-ratio:4/3">
			{% if post.image %}<img src="{{ post.image.url }}" alt="{{ post.title }}" class="w-full h-full object-cover group-hover:scale-[1.02] transition-transform">{% endif %}
		</div>
		<h3 class="mt-2 text-[14px] font-semibold text-black leading-snug">{{ post.title }}</h3>
		{% if post.excerpt %}<p class="mt-1 text-[12px] text-black/60 line-clamp-2">{{ post.excerpt }}</p>{% endif %}
	</a>
	{% empty %}
	<div class="text-center text-black/60 py-10">No posts yet.</div>
	{% endfor %}
</div>
{% endblock %}
