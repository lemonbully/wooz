{% extends "storefront/template4/_base.html" %}
{% block main %}
<main class="container">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="{% url 'public_website' %}">Home</a><span class="sep">/</span><span>Categories</span></nav>
  <div class="page-head sec-head" style="align-items:flex-end">
    <div><h1 class="h1">All <em class="hl">categories.</em></h1><p data-cats-intro></p></div>
    <a href="{% url 'public_all_products' %}" class="btn btn--black">Shop all products</a>
  </div>

  <!-- Featured pair -->
  <div class="grid grid--2" style="gap:16px;margin-bottom:clamp(24px,3vw,40px)" data-feature></div>

  <!-- All categories grid -->
  <div class="grid grid--4" data-cats style="row-gap:34px"></div>

  <!-- Trending in categories -->
  <section class="section" style="padding-bottom:0" data-sec-trending>
    <div class="sec-head"><div><p class="eyebrow">Trending now</p><h2 class="h2">Most loved <em class="hl">this week.</em></h2></div><a class="btn btn--outline btn--sm" href="{% url 'public_all_products' %}">View all</a></div>
    <div class="grid grid--4" data-trending></div>
  </section>
</main>
{% endblock %}

{% block page_scripts %}
<script nonce="{{ csp_nonce }}">
window.T3Page = function () {
  const D = T3, I = T3.I, $ = T3.$, esc = T3.esc;
  document.querySelectorAll('[data-ico]').forEach(e => e.innerHTML = I[e.dataset.ico]);
  const n = D.categories.length;
  $('[data-cats-intro]').textContent = n ? `${n} collection${n === 1 ? '' : 's'} from ${D.brand}. Pick a category to start exploring.` : `New collections from ${D.brand} are on their way.`;
  const bgs = ['var(--lilac)', 'var(--mint)'];
  /* Top pair: the two featured categories (T3.featuredCategories, the same
     pair as the Shop mega menu). Shown on top, they are left out of the grid. */
  const feat = T3.featuredCategories();
  const shownOnTop = feat.length === 2 ? feat : [];
  $('[data-feature]').innerHTML = feat.length === 2 ? feat.map((c, i) => `<a href="${c.url}" class="highlight-card reveal" style="background:${bgs[i]}">
    <div><span class="badge badge--light" style="align-self:flex-start">${c.count} products</span><h2 class="h1">${esc(c.name)}</h2>${c.desc ? `<p class="muted">${esc(c.desc)}</p>` : ''}<span class="btn btn--black btn--arrow" style="align-self:flex-start">Explore <span class="btn__dot">${I.arrow}</span></span></div>
    <div style="padding:0;overflow:hidden"><img src="${D.U(c.img, 700, 900)}" alt="" loading="lazy"></div></a>`).join('') : '';
  const rest = D.categories.filter(c => !shownOnTop.includes(c));
  $('[data-cats]').innerHTML = rest.map(c => `<a class="cat-card reveal" href="${c.url}">
    <div class="cat-card__media"><img src="${D.U(c.img, 600, 750)}" alt="${esc(c.name)}" loading="lazy"></div>
    <div class="cat-card__name" style="font-size:18px;justify-content:space-between;align-items:center"><span>${esc(c.name)} <sup>${c.count}</sup></span><span class="circle-btn" style="width:34px;height:34px">${I.right}</span></div>
    ${c.desc ? `<p class="cat-card__desc">${esc(c.desc)}</p>` : ''}</a>`).join('');
  const trending = [...D.products].sort((a, b) => (b.rating - a.rating) || (b.badges.includes('popular') - a.badges.includes('popular'))).slice(0, 8);
  $('[data-trending]').innerHTML = trending.map(p => T3.card(p)).join('');
  if (!trending.length) $('[data-sec-trending]').hidden = true;
};
</script>
{% endblock %}
