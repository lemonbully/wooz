{% extends "storefront/template4/_base.html" %}
{% block main %}
<main class="container" style="padding-top:clamp(24px,4vw,48px)">
  <h1 class="h1 title-count" style="margin-bottom:28px">Your <em class="hl">cart</em> <sup data-cart-count></sup></h1>
  <div data-cart-page></div>

  <section class="section" style="padding-bottom:0">
    <div data-services></div>
  </section>

  <section class="section" style="padding-bottom:0" data-sec-upsell>
    <div class="sec-head"><h2 class="h2">You may also <em class="hl">like.</em></h2><a class="btn btn--outline btn--sm" href="{% url 'public_all_products' %}">Continue shopping</a></div>
    <div class="grid grid--4" data-upsell></div>
  </section>
</main>
{% endblock %}

{% block page_scripts %}
<script nonce="{{ csp_nonce }}">
window.T3Page = function () {
  const D = T3, I = T3.I, $ = T3.$, esc = T3.esc, L = D.urls, C = D.contact || {};
  const root = $('[data-cart-page]');
  let loaded = false;
  function render() {
    const cart = T3.getCart(), tt = T3.getTotals(), total = tt.subtotal, mrp = T3.cartMrp(), left = D.freeShip ? Math.max(0, D.freeShip - total) : 0;
    if (!loaded) { root.innerHTML = `<div class="card empty-state" style="padding:60px 20px"><p class="muted">Loading your cart…</p></div>`; return; }
    if (!cart.length) {
      root.innerHTML = `<div class="card empty-state" style="padding:60px 20px">${I.bag.replace(/20/g, '56')}<h2 class="h3">Your cart is empty</h2><p class="muted" style="margin:8px 0 22px">Find something you love to start with.</p><a class="btn btn--black btn--arrow" href="${L.shop}">Continue Shopping <span class="btn__dot">${I.arrow}</span></a></div>`;
      return;
    }
    root.innerHTML = `<div class="cart-layout">
      <div>
        <div class="cart-row small muted hide-sm" style="padding:0 0 12px;font-weight:700;border:0"><span>Product</span><span></span><span>Quantity</span><span>Total</span><span></span></div>
        <div class="cart-table">${cart.map((l, i) => `<div class="cart-row">
          <a class="cart-row__img" href="${l.url}" aria-label="${esc(l.name)}"><img src="${l.img}" alt=""></a>
          <div class="cart-row__info"><a href="${l.url}" style="font-weight:700">${esc(l.name)}</a>${l.meta ? `<div class="small muted">${esc(l.meta)}</div>` : ''}${l.short ? `<div class="small" style="color:var(--badge-sale)">${l.inStock ? 'Only a few left in stock' : 'Out of stock'}</div>` : ''}${T3.priceHTML({ price: l.price, mrp: l.mrp })}</div>
          <div class="cart-row__qty"><div class="qty"><button data-qty="${i}" data-d="-1" aria-label="Decrease">${I.minus}</button><input value="${l.qty}" readonly aria-label="Quantity"><button data-qty="${i}" data-d="1" aria-label="Increase">${I.plus}</button></div><button class="line-item__remove" data-remove="${i}" style="display:none">Remove</button></div>
          <div class="cart-row__total">${D.showPrice ? T3.inr(l.line) : ''}</div>
          <button class="line-item__remove cart-row__rm" data-remove="${i}">Remove</button>
        </div>`).join('')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px;flex-wrap:wrap">
          <a href="${L.shop}" class="link small">${'← '}Continue shopping</a>
        </div>
      </div>
      <aside class="summary">
        ${D.freeShip ? `<div class="ship-progress">${left ? `Spend <b>${T3.inr(left)}</b> more to reach free shipping!` : 'Free shipping unlocked!'}<div class="ship-progress__bar"><i style="width:${Math.min(100, total / D.freeShip * 100)}%"></i></div></div>` : ''}
        ${T3.acc('Discount code', `<form class="coupon-row" style="margin:4px 0 0" data-coupon><input class="input" name="code" placeholder="Enter code" style="background:#fff" value="${esc(tt.coupon || '')}"><button class="btn btn--black">Apply</button></form><p class="small" style="margin-top:8px" data-coupon-msg></p>`, !!tt.coupon).replace('class="acc', 'class="acc acc--pill')}
        ${T3.acc('Shipping estimate', `<form class="pincode" style="margin:0" data-est><input class="input" style="background:#fff" placeholder="Pincode" maxlength="6" inputmode="numeric"><button class="btn btn--black">Estimate</button></form><p class="small" style="margin-top:8px" data-est-msg></p>`).replace('class="acc', 'class="acc acc--pill')}
        <div class="sum-rows" style="margin-top:14px">
          <div><span class="muted">Subtotal (MRP)</span><span>${T3.inr(mrp)}</span></div>
          ${mrp > total ? `<div style="color:var(--ok)"><span>Product discount</span><span>- ${T3.inr(mrp - total)}</span></div>` : ''}
          ${tt.discount > 0 ? `<div style="color:var(--ok)"><span>Coupon ${esc(tt.coupon)}</span><span>- ${T3.inr(tt.discount)}</span></div>` : ''}
          ${tt.credit > 0 ? `<div style="color:var(--ok)"><span>Store credit</span><span>- ${T3.inr(tt.credit)}</span></div>` : ''}
          <div><span class="muted">Shipping</span><span>${D.freeShip && !left ? 'Free' : 'At checkout'}</span></div>
        </div>
        <div class="summary__total"><b>Estimated total</b><span class="amt">${T3.inr(tt.total)}</span></div>
        <p class="summary__note" style="margin-bottom:16px">Taxes included. Shipping calculated at checkout.</p>
        <a class="btn btn--black btn--block" href="${L.checkout}">Check Out</a>
        <div class="pay-icons" style="justify-content:center;margin-top:14px"><span style="background:var(--surface)">UPI</span><span style="background:var(--surface)">VISA</span><span style="background:var(--surface)">MC</span><span style="background:var(--surface)">RUPAY</span><span style="background:var(--surface)">COD</span></div>
      </aside>
    </div>`;
    T3.initAcc(root);
  }
  render();
  document.addEventListener('t3:cart', () => { loaded = true; render(); });
  T3.loadCart().then(() => { loaded = true; render(); });
  root.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.matches('[data-coupon]')) {
      const v = e.target.querySelector('input').value.trim();
      if (!v) return;
      T3.post(L.coupon, { code: v }).then(res => { const j = res.data || {}; T3.toast(j.message || (res.ok ? 'Code applied' : 'That code is not valid')); return T3.loadCart(); });
    }
    if (e.target.matches('[data-est]')) {
      const v = e.target.querySelector('input').value.trim(), m = $('[data-est-msg]');
      if (!/^\d{6}$/.test(v)) { m.textContent = 'Enter a valid 6 digit pincode.'; return; }
      m.textContent = 'Checking…';
      fetch(`${L.pincode}?pincode=${v}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } }).then(r => r.json()).then(j => { m.textContent = j.message || ''; }).catch(() => { m.textContent = 'Could not check right now.'; });
    }
  });
  const up = D.products.filter(p => p.inStock).slice(0, 4);
  $('[data-upsell]').innerHTML = up.map(p => T3.card(p)).join('');
  if (!up.length) $('[data-sec-upsell]').hidden = true;
};
</script>
{% endblock %}
