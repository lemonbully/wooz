{% extends "storefront/template4/_base.html" %}
{% block main %}
<main class="container">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="{% url 'public_website' %}">Home</a><span class="sep">/</span><a href="{% url 'public_blogs' %}">Blogs</a><span class="sep">/</span><span data-crumb>{{ blog.title }}</span></nav>
  <header style="max-width:860px;margin:10px auto 0;text-align:center">
    <span class="badge badge--popular" data-tag></span>
    <h1 class="mega" style="margin:16px 0" data-title>{{ blog.title }}</h1>
    <div class="author" style="justify-content:center"><img src="" data-author alt=""><div style="text-align:left"><b data-author-name></b><div class="small muted" data-meta></div></div></div>
  </header>
  <div class="article-hero"><img src="" data-hero alt=""></div>

  <div class="article-layout">
    <aside class="toc" data-toc><p class="eyebrow muted" style="margin-bottom:10px">In this article</p></aside>
    <article class="prose" data-body>{{ blog.description|safe }}</article>
    <aside class="aside-r" data-shop-wrap>
      <div style="position:sticky;top:100px">
        <p class="eyebrow muted" style="margin-bottom:12px">Shop the article</p>
        <div style="display:grid;gap:14px" data-shop></div>
      </div>
    </aside>
  </div>

  <section class="section" style="padding-bottom:0" data-sec-more>
    <div class="sec-head"><h2 class="h2">Keep <em class="hl">reading.</em></h2><a href="{% url 'public_blogs' %}" class="btn btn--outline btn--sm">All articles</a></div>
    <div class="grid grid--3" data-more></div>
  </section>
</main>
{% endblock %}

{% block page_scripts %}
<script nonce="{{ csp_nonce }}">
window.T3Page = function () {
  const D = T3, $ = T3.$, esc = T3.esc;
  const b = D.page.blog;
  if (!b) return;
  $('[data-crumb]').textContent = b.title; $('[data-tag]').textContent = b.tag; $('[data-title]').textContent = b.title;
  $('[data-meta]').textContent = [b.date, b.read].filter(Boolean).join(' · ');
  $('[data-author-name]').textContent = b.author || D.brand;
  $('[data-author]').src = D.U((D.logo || {}).desktop || '@avatar4', 100, 100);
  $('[data-hero]').src = D.U(b.img, 2000, 860); $('[data-hero]').alt = b.title;
  /* Table of contents from the article's own headings. */
  const heads = [...$('[data-body]').querySelectorAll('h2, h3')].slice(0, 8);
  heads.forEach((h, i) => { if (!h.id) h.id = 's' + (i + 1); });
  if (heads.length) $('[data-toc]').insertAdjacentHTML('beforeend', heads.map(h => `<a href="#${h.id}">${esc(h.textContent)}</a>`).join(''));
  else $('[data-toc]').style.visibility = 'hidden';
  const shop = D.products.slice(0, 3);
  $('[data-shop]').innerHTML = shop.map(p => `<a class="search-hit" href="${p.url}"><img src="${p.img[0]}" alt=""><span><b>${esc(p.name)}</b>${T3.priceHTML(p)}</span></a>`).join('');
  if (!shop.length) $('[data-shop-wrap]').style.visibility = 'hidden';
  const more = D.blogs.filter(x => x.slug !== b.slug).slice(0, 3);
  $('[data-more]').innerHTML = more.map(x => `<a class="blog-card reveal" href="${x.url}"><div class="blog-card__media"><img src="${D.U(x.img, 1200, 900)}" alt="" loading="lazy"><span class="badge badge--light">${esc(x.tag)}</span></div><div class="blog-card__meta">${esc(x.date)}<i></i>${esc(x.read)}</div><h3>${esc(x.title)}</h3><p>${esc(x.excerpt)}</p></a>`).join('');
  if (!more.length) $('[data-sec-more]').hidden = true;
};
</script>
{% endblock %}
