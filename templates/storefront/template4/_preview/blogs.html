<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Journal | velora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Nunito:wght@300;400;600&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div data-header></div>
<main class="container">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span>Journal</span></nav>
  <div class="page-head sec-head">
    <div><h1 class="mega">The <em class="hl">Journal.</em></h1><p>Routines, ingredient guides and stories from our lab.</p></div>
    <div class="pill-tabs" data-filter><button class="is-active" data-f="">All</button><button data-f="Routines">Routines</button><button data-f="Ingredients">Ingredients</button><button data-f="Sun care">Sun care</button><button data-f="Rituals">Rituals</button><button data-f="Our story">Our story</button></div>
  </div>

  <a class="highlight-card highlight-card--wide reveal" data-featured style="background:var(--lilac)"></a>

  <div class="grid grid--3" data-list style="margin-top:clamp(28px,4vw,48px);row-gap:40px"></div>
  <div class="pagination"><a href="#" class="is-active">1</a><a href="#">2</a><a href="#">3</a></div>
</main>
<div data-footer></div>
<script src="assets/js/data.js"></script>
<script>
window.T3Page = function () {
  const D = T3, I = T3.I, $ = T3.$;
  const f = D.blogs[0];
  const feat = $('[data-featured]');
  feat.href = `blog.html?b=${f.slug}`;
  feat.innerHTML = `<div style="padding:0;overflow:hidden"><img src="${f.img}" alt=""></div><div><span class="badge badge--light" style="align-self:flex-start">Featured · ${f.tag}</span><h2 class="h1">${f.title}</h2><p class="muted">${f.excerpt}</p><div class="blog-card__meta" style="margin:0">${f.date}<i></i>${f.read}</div><span class="btn btn--black" style="align-self:flex-start">Read article <span class="btn__dot">${I.arrow}</span></span></div>`;
  const all = [...D.blogs.slice(1), ...D.blogs.slice(0, 4).map(b => ({ ...b, title: b.title.replace(/^(How to|The)/, 'More on:') }))];
  const render = tag => { $('[data-list]').innerHTML = all.filter(b => !tag || b.tag === tag).map(b => `<a class="blog-card reveal" href="blog.html?b=${b.slug}"><div class="blog-card__media"><img src="${b.img}" alt="" loading="lazy"><span class="badge badge--light">${b.tag}</span></div><div class="blog-card__meta">${b.date}<i></i>${b.read}</div><h3>${b.title}</h3><p>${b.excerpt}</p></a>`).join('') || '<p class="muted">No articles in this topic yet.</p>'; T3.initReveal($('[data-list]')); };
  render('');
  $('[data-filter]').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('[data-filter] .is-active').classList.remove('is-active'); b.classList.add('is-active'); render(b.dataset.f); });
};
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
