<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | velora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Nunito:wght@300;400;600&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div data-header></div>
<main class="container">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep">&gt;</span><span>Products</span></nav>
  <div class="page-head"><h1 class="h1">All <em class="hl">products.</em></h1><p>Clean, botanical formulas for every skin type. Free shipping over ₹1,499.</p></div>

  <div class="slider" data-slider>
    <div class="slider__track" data-subcats style="--col:calc((100% - 3*16px)/4);--col-sm:72%"></div>
  </div>

  <div data-collection></div>

  <section class="section" style="padding-bottom:0">
    <div class="sec-head sec-head--center"><h2 class="h2">Shop by <em class="hl">skin concern.</em></h2></div>
    <div class="grid grid--5" data-concerns style="row-gap:20px"></div>
  </section>
</main>

<section class="section"><div class="container services" data-services></div></section>
<div data-footer></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/collection.js"></script>
<script>
window.T3Page = function () {
  const D = T3, I = T3.I, $ = T3.$;
  $('[data-subcats]').innerHTML = D.categories.map(c => `<a class="cat-card" href="category.html?c=${c.slug}"><div class="cat-card__media"><img src="${D.U(c.img, 700, 525)}" alt="" loading="lazy"><span class="cat-card__pill">${c.name}</span></div></a>`).join('');
  T3Collection({
    root: '[data-collection]', products: D.products,
    promo: `<a href="shop.html?sale=1" class="promo-tile reveal" style="background:url(${D.U(D.IMG.amberOrange, 700, 900)}) center/cover"><div style="position:relative;z-index:1"><span class="badge badge--sale">Up to 20% off</span><h3 style="margin:10px 0 14px">Body care<br><em class="hl">sale is live.</em></h3><span class="btn btn--white btn--sm">Shop sale</span></div></a>`
  });
  $('[data-concerns]').innerHTML = [['face2', 'Acne & Blemishes', 92], ['facial2', 'Dryness', 84], ['face3', 'Pores & Oily Skin', 64], ['orangeFace', 'Dullness', 51], ['mask', 'Redness', 38]]
    .map(([k, n, c]) => `<a class="cat-circle reveal" href="shop.html"><div class="cat-circle__img"><img src="${D.U(D.IMG[k], 300, 300)}" alt="" loading="lazy"></div><b>${n}</b><div class="small">(${c})</div></a>`).join('');
  $('[data-services]').innerHTML = [['truck', 'Free delivery', 'On orders above ₹1,499'], ['return', 'Skin match promise', 'One free exchange, even if opened'], ['card', 'Secure payments', 'UPI, cards, netbanking and COD'], ['chat', 'Skin experts', 'Mon to Sat, 9 AM to 8 PM']].map(([i, t, s]) => `<div class="service">${I[i]}<b>${t}</b><span>${s}</span></div>`).join('');
};
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
