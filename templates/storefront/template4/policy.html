{% extends "storefront/template4/_base.html" %}
{% block main %}
<main class="container">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="{% url 'public_website' %}">Home</a><span class="sep">/</span><span>Policies</span><span class="sep">/</span><span data-crumb></span></nav>
  <div class="page-head"><h1 class="h1" data-title>{{ page_title }}</h1><p class="small" data-updated></p></div>
  <div class="policy-layout">
    <nav class="policy-nav" data-nav aria-label="Policies"></nav>
    <article class="prose" data-body style="max-width:760px"></article>
  </div>
</main>
{% endblock %}

{% block page_scripts %}
<script nonce="{{ csp_nonce }}">
window.T3Page = function () {
  const D = T3, $ = T3.$, esc = T3.esc, L = D.urls, C = D.contact || {};
  const P = D.page.policy || { key: '', title: D.page.title || 'Policy', html: '' };
  const brand = esc(D.brand);
  const mail = C.email ? `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>` : `our <a href="${L.contact}">contact page</a>`;
  /* Shown only while the owner has not written this policy yet. */
  const FALLBACK = {
    privacy: `<p>${brand} respects your privacy. We collect only the information needed to process your orders and support you, and we never sell your personal data.</p><h2>What we collect</h2><ul><li>Contact details you share at checkout</li><li>Order history and saved addresses</li><li>Anonymous browsing analytics to improve the store</li></ul><h2>Your rights</h2><p>You can ask us to update or delete your data at any time.</p>`,
    terms: `<p>By browsing ${brand} or placing an order, you agree to these terms.</p><h2>Pricing</h2><p>All prices are shown in ${esc(D.currency || 'INR')} and include applicable taxes unless stated otherwise.</p><h2>Orders</h2><p>An order is confirmed once you receive a confirmation email.</p>`,
    refund: `<p>If something is not right with your order, here is how cancellations, returns and refunds work at ${brand}.</p><h2>Returns</h2><p>Eligible items can be returned as described on each product page.</p><h2>Refunds</h2><p>Refunds are issued to the original payment method once the return is received.</p>`,
    shipping: `<p>Orders are processed and shipped as quickly as possible. Tracking details are shared as soon as your order leaves us.</p>`,
  };
  const key = (P.key || '').split(':')[0];
  $('[data-crumb]').textContent = P.title; $('[data-title]').textContent = P.title;
  let html = P.html || FALLBACK[key] || '<p>This policy will be published soon.</p>';
  const RT = P.returnTerms;
  if (RT) {
    const grp = (t, items, label) => items && items.length ? `<h2>${t}</h2><ul>${items.map(i => `<li>${esc(i.title)}${i.days ? ` (${esc(label.replace('{d}', i.days))})` : ''}</li>`).join('')}</ul>` : '';
    html += grp('Returnable products', RT.returnable, '{d} day return') + grp('Replacement only', RT.replacement, '{d} day replacement') + grp('Non-returnable products', RT.non_returnable, 'replacement within {d} days');
  }
  $('[data-body]').innerHTML = html + `<blockquote>Questions? Write to ${mail}${C.phone ? ` or call ${esc(C.phone)}` : ''}.</blockquote>`;
  const nav = [[L.policy.refund, 'Refund & Return Policy', 'refund'], [L.policy.shipping, 'Shipping Policy', 'shipping'], [L.policy.privacy, 'Privacy Policy', 'privacy'], [L.policy.terms, 'Terms & Conditions', 'terms']]
    .concat((D.customPolicies || []).map(cp => [cp.url, cp.title, '']));
  $('[data-nav]').innerHTML = nav.map(([h, t, k]) => `<a href="${h}" class="${(k && k === key) || (!k && location.pathname === h) ? 'is-active' : ''}">${esc(t)}</a>`).join('');
  $('[data-updated]').hidden = true;
};
</script>
{% endblock %}
