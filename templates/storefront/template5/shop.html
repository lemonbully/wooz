<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | oakline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div data-header></div>
<main class="container">
  <section class="coll-hero">
    <img src="" data-coll-img alt="">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep">&gt;</span><a href="categories.html">Collections</a><span class="sep">&gt;</span><span>All Products</span></nav>
    <h1 class="h1">All Products</h1><p>Furniture worth keeping. Free delivery and assembly over ₹25,000.</p>
  </section>
  <div style="height:26px"></div>

  <div class="slider" data-slider>
    <div class="slider__track" data-subcats style="--col:calc((100% - 3*16px)/4);--col-sm:72%"></div>
  </div>

  <div data-collection></div>

  <section class="section" style="padding-bottom:0">
    <div class="sec-head sec-head--center"><h2 class="h2">Shop by Room</h2></div>
    <div class="grid grid--5" data-concerns style="row-gap:20px"></div>
  </section>
</main>

<section class="section"><div class="container services" data-services></div></section>
<div data-footer></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/collection.js"></script>
<script>
window.T3Page = function () {
  const D = T3, I = T3.I, $ = T3.$;
  $('[data-coll-img]').src = D.U(D.IMG.living4, 2000, 700);
  $('[data-subcats]').innerHTML = D.categories.map(c => `<a class="cat-card" href="category.html?c=${c.slug}"><div class="cat-card__media"><img src="${D.U(c.img, 700, 525)}" alt="" loading="lazy"></div><span class="cat-card__pill">${c.name}</span></a>`).join('');
  T3Collection({
    root: '[data-collection]', products: D.products,
    promo: `<a href="shop.html?sale=1" class="promo-tile reveal" style="background:url(${D.U(D.IMG.orangeSofa, 700, 900)}) center/cover"><div style="position:relative;z-index:1"><span class="badge badge--sale">Up to 20% off</span><h3 style="margin:10px 0 14px">Season-end<br>sale is live</h3><span class="btn btn--white btn--sm">Shop sale</span></div></a>`
  });
  $('[data-concerns]').innerHTML = [['living3', 'Living Room', 92], ['bedroom1', 'Bedroom', 44], ['dining1', 'Dining', 64], ['deskChairs', 'Workspace', 31], ['chairPlant', 'Reading Nook', 38]]
    .map(([k, n, c]) => `<a class="cat-circle reveal" href="shop.html"><div class="cat-circle__img"><img src="${D.U(D.IMG[k], 300, 300)}" alt="" loading="lazy"></div><b>${n}</b><div class="small">(${c})</div></a>`).join('');
  $('[data-services]').innerHTML = [['truck', 'Free delivery', 'And assembly over ₹25,000'], ['return', '7 day replacement', 'If it arrives damaged'], ['card', 'Secure payments', 'UPI, cards, netbanking and COD'], ['chat', 'Design advice', 'Mon to Sat, 9 AM to 8 PM']].map(([i, t, s]) => `<div class="service">${I[i]}<b>${t}</b><span>${s}</span></div>`).join('');
};
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
